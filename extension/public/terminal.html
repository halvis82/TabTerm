<!doctype html>
<meta charset="utf-8" />
<title>Terminal</title>
<link rel="stylesheet" href="xterm.css" />
<link rel="icon" id="favicon" />
<style>
  :root {
    color-scheme: dark;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: #12131a;
    overflow: hidden;
  }
  /* --- split layout ---------------------------------------------------- */
  .split-node {
    display: flex;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
  }
  .split-horizontal {
    flex-direction: row;
  }
  .split-vertical {
    flex-direction: column;
  }
  .split-node.maximized > .pane {
    flex: 1 1 100%;
  }

  .pane {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    flex: 1 1 0;
    border: 1px solid transparent;
    border-radius: 4px;
  }
  /* The focused pane is the one receiving keystrokes, so it has to be obvious at a glance. */
  .pane.focused {
    border-color: #4a5573;
  }
  .pane-terminal {
    position: absolute;
    inset: 0;
    padding: 4px 6px;
  }

  /* A quiet corner label. It must never compete with the terminal for attention. */
  .pane-time {
    position: absolute;
    right: 8px;
    bottom: 4px;
    font:
      10.5px/1.4 ui-monospace,
      SFMono-Regular,
      Menlo,
      monospace;
    color: #5f6579;
    background: rgba(18, 19, 26, 0.82);
    padding: 1px 6px;
    border-radius: 4px;
    pointer-events: none;
    opacity: 0.85;
  }
  .pane:not(.focused) .pane-time {
    opacity: 0.5;
  }

  .divider {
    flex: 0 0 6px;
    background: #1c1e28;
    position: relative;
  }
  .divider::after {
    content: '';
    position: absolute;
    inset: -3px;
  }
  .divider-horizontal {
    cursor: col-resize;
  }
  .divider-vertical {
    cursor: row-resize;
  }
  .divider:hover,
  .divider.dragging {
    background: #5b6a92;
  }

  /*
   * A flex container, because its child is a flex item.
   *
   * A single-pane workspace renders one `.pane` directly here, with no `.split-node` between
   * them, and `.pane` is `flex: 1 1 0`. Against a block parent that resolves to zero height, so
   * the terminal collapsed to a few pixels and the tab looked simply dark. Splits were fine,
   * because a split does insert a flex wrapper -- which is why this survived: every test that
   * split a pane passed.
   */
  #terminal {
    position: absolute;
    inset: 0;
    padding: 6px 8px;
    display: flex;
    min-width: 0;
    min-height: 0;
  }

  /*
   * While the panel is up, the terminal keeps the bottom of the window.
   *
   * A terminal's input belongs at the bottom, and the panel is drawn in the space above it that
   * has no output in it yet. The terminal really is smaller here rather than being visually
   * shifted: the shell is told its true size, so what is on screen is what it thinks it has.
   */
  #terminal.panel-open {
    align-items: flex-end;
  }
  #terminal.panel-open > .pane,
  #terminal.panel-open > .split-node {
    /* A fixed height, not a cap: `flex: 1 1 0` against `align-items: flex-end` shrinks to
       content, which is a couple of pixels. */
    /* Fixed height, full width. `flex: 0 0 auto` alone sizes to content in both directions,
       which collapsed the strip horizontally to nothing. */
    flex: 0 0 auto;
    width: 100%;
    height: 4.5rem;
  }
  .xterm-viewport::-webkit-scrollbar {
    width: 9px;
  }
  .xterm-viewport::-webkit-scrollbar-thumb {
    background: #333849;
    border-radius: 5px;
  }
  #status {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    z-index: 5;
    font:
      12px/1.9 -apple-system,
      BlinkMacSystemFont,
      sans-serif;
    text-align: center;
    color: #12131a;
  }
  #status[data-tone='warn'] {
    background: #e8c26a;
  }
  #status[data-tone='error'] {
    background: #e0776b;
  }
  /* An explicit display value overrides the `hidden` attribute, so without these rules this
     overlay covered a perfectly healthy terminal permanently. */
  #server-offer[hidden],
  #staged[hidden],
  #recovery[hidden],
  #status[hidden] {
    display: none;
  }
  /* Links only activate while Command is held, so the terminal stays a terminal. */
  body.cmd-held .xterm-screen {
    cursor: pointer;
  }
  /* --- reset confirmation ------------------------------------------------ */

  .reset {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .reset-card {
    width: min(440px, 100%);
    padding: 22px 22px 18px;
    border-radius: 14px;
    border: 1px solid rgba(255, 138, 122, 0.28);
    background: rgba(24, 26, 35, 0.92);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  .reset-title {
    margin: 0 0 8px;
    font-size: 16px;
    font-weight: 600;
    color: #e8e8e8;
  }
  .reset-body {
    margin: 0 0 10px;
    font-size: 13px;
    line-height: 1.5;
    color: #cdd2dd;
  }
  .reset-warning {
    margin: 0 0 10px;
    padding: 7px 10px;
    border-radius: 8px;
    background: rgba(255, 200, 87, 0.1);
    color: #ffc857;
    font-size: 12px;
  }
  .reset-list {
    margin: 0 0 14px;
    padding-left: 18px;
    color: #9aa0a6;
    font-size: 12px;
    line-height: 1.7;
  }
  .reset-option {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 16px;
    color: #cdd2dd;
    font-size: 12.5px;
    cursor: pointer;
  }
  .reset-option span {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .reset-option small {
    color: #7d8496;
    font-size: 11px;
  }
  .reset-option input {
    margin-top: 2px;
    width: 15px;
    height: 15px;
    accent-color: #3d6ba8;
  }
  .reset-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .reset-cancel,
  .reset-confirm {
    padding: 7px 14px;
    border-radius: 8px;
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }
  .reset-cancel {
    border: 1px solid rgba(90, 100, 130, 0.4);
    background: transparent;
    color: #cdd2dd;
  }
  .reset-cancel:hover {
    border-color: #3d6ba8;
    color: #e8e8e8;
  }
  /* The destructive one is never the default, and it looks like what it does. */
  .reset-confirm {
    border: 1px solid rgba(255, 138, 122, 0.45);
    background: rgba(255, 138, 122, 0.14);
    color: #ff8a7a;
  }
  .reset-confirm:hover {
    background: rgba(255, 138, 122, 0.24);
    color: #ffb3a8;
  }

  /* --- running sessions, on the start screen ----------------------------- */

  .sessions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 0 0 22px;
  }
  .sessions-heading {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #7d8496;
  }
  .sessions-count {
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(122, 162, 247, 0.14);
    color: #9ec5ff;
    font-size: 10px;
    letter-spacing: 0;
  }

  /* Wide enough for a readable preview, and it reflows rather than scrolling sideways. */
  .session-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
    gap: 10px;
  }

  .session-grid.is-scrolling {
    max-height: 300px;
    overflow-y: auto;
    padding-right: 4px;
    /* Scoped to this list, so the scrollbar styling cannot leak into a terminal. */
    scrollbar-width: thin;
    scrollbar-color: rgba(90, 100, 130, 0.5) transparent;
  }
  .session-card {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 10px;
    border: 1px solid rgba(90, 100, 130, 0.28);
    background: rgba(24, 26, 35, 0.66);
    cursor: pointer;
    /* Only the cheap properties, so a grid of these never costs a frame. */
    transition:
      border-color 140ms ease,
      transform 140ms ease,
      background 140ms ease;
  }
  .session-card:hover,
  .session-card:focus-visible {
    transform: translateY(-1px);
    border-color: #3d6ba8;
    background: rgba(30, 33, 45, 0.82);
    outline: none;
  }

  .session-head {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 10px 7px;
  }
  .session-dot {
    flex: none;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #5b6070;
  }
  /* Attached, unattached and busy are the distinctions the list exists to draw. */
  .session-card[data-state='attached'] .session-dot {
    background: #8ab4f8;
    box-shadow: 0 0 0 3px rgba(138, 180, 248, 0.16);
  }
  .session-card[data-busy='true'] .session-dot {
    background: #6ee7a0;
    box-shadow: 0 0 0 3px rgba(110, 231, 160, 0.16);
    animation: session-pulse 1.6s ease-in-out infinite;
  }
  @keyframes session-pulse {
    50% {
      opacity: 0.45;
    }
  }
  /* Somebody who set their system to reduce motion means it. */
  @media (prefers-reduced-motion: reduce) {
    .session-card,
    .session-card[data-busy='true'] .session-dot {
      transition: none;
      animation: none;
    }
  }

  .session-title {
    flex: 1 1 auto;
    overflow: hidden;
    font-size: 12.5px;
    color: #e8e8e8;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: rtl;
    text-align: left;
  }
  .session-badge {
    flex: none;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(90, 100, 130, 0.18);
    color: #7d8496;
    font-size: 9.5px;
    letter-spacing: 0.02em;
  }
  .session-card[data-state='attached'] .session-badge {
    background: rgba(138, 180, 248, 0.14);
    color: #9ec5ff;
  }

  /**
   * A miniature of the screen.
   *
   * Bottom aligned, because a terminal's newest line is at the bottom and a preview that grew
   * downward from the top would show the oldest thing it knows.
   */
  .session-screen {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    height: 88px;
    padding: 8px 10px;
    overflow: hidden;
    background: #0c0d12;
    border-top: 1px solid rgba(90, 100, 130, 0.14);
    border-bottom: 1px solid rgba(90, 100, 130, 0.14);
    color: #9aa4bd;
    font-family: inherit;
    font-size: 10px;
    line-height: 1.5;
    /* Faded at the top, so the miniature reads as a window onto something longer. */
    mask-image: linear-gradient(to bottom, transparent, #000 22px);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 22px);
  }
  /* Taller here than on a card: this is the only thing left of the session. */
  .recovery-screen {
    height: auto;
    max-height: 220px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid rgba(90, 100, 130, 0.2);
    font-size: 11px;
  }
  .session-line {
    overflow: hidden;
    white-space: pre;
    text-overflow: clip;
  }
  /* The last line is the one that says what happened, so it reads as the live one. */
  .session-line:last-child {
    color: #cdd2dd;
  }
  .session-screen.is-empty {
    justify-content: center;
    color: #5b6070;
    font-style: italic;
    mask-image: none;
    -webkit-mask-image: none;
  }

  .session-foot {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px 8px;
    font-size: 10.5px;
    color: #7d8496;
  }
  .session-what {
    flex: 1 1 auto;
    overflow: hidden;
    color: #9aa0a6;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .session-when {
    flex: none;
  }
  .session-close {
    flex: none;
    width: 18px;
    height: 18px;
    padding: 0;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: #5b6070;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity 120ms ease;
  }
  /* Hidden until the card is under the pointer: ending a session is not a thing to invite. */
  .session-card:hover .session-close,
  .session-card:focus-within .session-close {
    opacity: 1;
  }
  .session-close:hover {
    background: rgba(255, 138, 122, 0.14);
    color: #ff8a7a;
  }

  /* --- command panel ---------------------------------------------------- */

  /* The button that opens it. Small, out of the way, and always in the same place. */
  #cmd-button {
    position: absolute;
    top: 8px;
    right: 10px;
    z-index: 30;
    width: 26px;
    height: 26px;
    border-radius: 7px;
    border: 1px solid #2f3346;
    background: rgba(26, 28, 38, 0.72);
    color: #9aa0a6;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  #cmd-button:hover {
    color: #e8e8e8;
    border-color: #3d6ba8;
  }
  /* Under the menu icon, and only there for a few seconds after a clear. */
  #clear-undo {
    position: absolute;
    top: 40px;
    right: 10px;
    z-index: 30;
    padding: 4px 9px;
    border-radius: 7px;
    border: 1px solid #2f3346;
    background: rgba(26, 28, 38, 0.85);
    color: #9ec5ff;
    font: inherit;
    font-size: 11px;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  #clear-undo:hover {
    color: #e8e8e8;
    border-color: #3d6ba8;
  }

  /*
   * Translucent, because there is terminal output behind it and hiding that is the one thing a
   * terminal panel must not do. The blur keeps it readable over busy output without making it
   * opaque.
   */
  .cmd-panel {
    position: absolute;
    z-index: 45;
    width: 460px;
    max-height: min(560px, calc(100% - 24px));
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(140, 155, 190, 0.28);
    border-radius: 12px;
    /*
     * Genuinely see-through. 0.82 was opaque enough that the blur behind it made no difference,
     * which is the same as not being translucent at all. The blur does the legibility work so
     * the fill can stay light.
     */
    background: rgba(20, 23, 33, 0.55);
    backdrop-filter: blur(26px) saturate(155%);
    -webkit-backdrop-filter: blur(26px) saturate(155%);
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
    overflow: hidden;
  }
  .cmd-panel[hidden],
  .cmd-puck[hidden] {
    display: none;
  }

  .cmd-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    cursor: grab;
    border-bottom: 1px solid rgba(140, 155, 190, 0.16);
  }
  .cmd-header:active {
    cursor: grabbing;
  }
  .cmd-tabs {
    display: flex;
    gap: 4px;
  }
  .cmd-tab {
    font: inherit;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: #8a91a3;
    cursor: pointer;
  }
  .cmd-tab.on {
    background: rgba(61, 107, 168, 0.35);
    border-color: rgba(127, 168, 216, 0.5);
    color: #e8e8e8;
  }

  .cmd-search {
    margin: 8px;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid rgba(140, 155, 190, 0.22);
    background: rgba(12, 14, 20, 0.45);
    color: #e8e8e8;
    font: inherit;
    font-size: 13px;
  }
  .cmd-search:focus {
    outline: none;
    border-color: #3d6ba8;
  }

  .cmd-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 6px 6px;
  }
  .cmd-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .cmd-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
  }
  .cmd-row-label {
    flex: 0 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 13px;
  }
  .cmd-row.is-action .cmd-row-label {
    color: #9ec5ff;
  }
  .cmd-row.failed .cmd-row-label {
    color: #e8908f;
  }
  .cmd-row-meta {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 11px;
    color: #7d8496;
  }
  /* Selection carries an accent bar as well as a background: it is a step of its own. */
  .cmd-row.selected {
    background: rgba(70, 100, 155, 0.42);
    box-shadow: inset 3px 0 0 #8fb6e8;
  }
  .cmd-row:hover:not(.selected) {
    background: rgba(140, 155, 190, 0.12);
  }

  /* A visible marker, so an abbreviation is discoverable from the list. */
  .cmd-hotstring {
    flex: 0 0 auto;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(61, 107, 168, 0.3);
    color: #9ec5ff;
  }

  .cmd-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 10px;
    border-top: 1px solid rgba(140, 155, 190, 0.16);
    font-size: 11px;
    color: #7d8496;
  }
  .cmd-hints {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cmd-icon {
    flex: 0 0 auto;
    background: transparent;
    border: 0;
    color: #7d8496;
    font-size: 13px;
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 5px;
  }
  .cmd-icon:hover {
    color: #e8e8e8;
    background: rgba(90, 100, 130, 0.25);
  }

  .cmd-stats {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px;
  }
  .cmd-figures {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .cmd-figure {
    padding: 7px 9px;
    border-radius: 8px;
    background: rgba(140, 155, 190, 0.1);
  }
  .cmd-figure-value {
    font-size: 15px;
    color: #e8e8e8;
  }
  .cmd-figure-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #7d8496;
    margin-top: 2px;
  }
  .cmd-stat-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .cmd-stat-row {
    display: flex;
    align-items: baseline;
    gap: 9px;
    padding: 3px 6px;
    border-radius: 5px;
    font-size: 12px;
  }
  .cmd-stat-row:hover {
    background: rgba(140, 155, 190, 0.1);
  }
  .cmd-stat-row.failed .cmd-stat-command {
    color: #e8908f;
  }
  /* Time and duration never truncate: reading a session back is usually about what was slow. */
  .cmd-stat-time {
    flex: 0 0 auto;
    color: #7d8496;
    font-variant-numeric: tabular-nums;
  }
  .cmd-stat-command {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #d5d8e2;
  }
  .cmd-stat-duration {
    flex: 0 0 auto;
    color: #9ec5ff;
    font-variant-numeric: tabular-nums;
  }

  .cmd-keys {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 0 8px;
  }
  .cmd-key-row {
    display: flex;
    gap: 10px;
    font-size: 12px;
    color: #9aa0a6;
  }
  .cmd-key-row kbd {
    flex: 0 0 78px;
    font-family: inherit;
    color: #9ec5ff;
  }

  .cmd-empty,
  .cmd-note {
    padding: 10px 8px;
    font-size: 12px;
    color: #7d8496;
  }
  .cmd-add {
    margin: 4px 2px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px dashed rgba(90, 100, 130, 0.5);
    background: transparent;
    color: #9aa0a6;
    font: inherit;
    font-size: 12px;
    text-align: left;
    cursor: pointer;
  }
  .cmd-add:hover {
    color: #e8e8e8;
    border-color: #3d6ba8;
  }

  .cmd-edit,
  .cmd-settings {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 8px;
  }
  .cmd-field {
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 11px;
    color: #8a91a3;
  }
  .cmd-field input,
  .cmd-field select {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid rgba(90, 100, 130, 0.35);
    background: rgba(16, 18, 22, 0.7);
    color: #e8e8e8;
    font: inherit;
    font-size: 13px;
  }
  /* A group of related switches, set apart without a heavy rule between them. */
  .cmd-section {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(90, 100, 130, 0.18);
  }
  .cmd-section .cmd-note {
    padding: 2px 0 0;
    color: #9aa0a6;
    font-weight: 500;
  }
  /* Label first, control at the end, so the switches line up down the right edge. */
  .cmd-toggle {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 12px;
    color: #cdd2dd;
    cursor: pointer;
  }
  .cmd-toggle span {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .cmd-toggle small {
    font-size: 10.5px;
    color: #7d8496;
  }
  .cmd-toggle input[type='checkbox'] {
    flex: none;
    width: 16px;
    height: 16px;
    padding: 0;
    accent-color: #3d6ba8;
    cursor: pointer;
  }
  .cmd-dim {
    color: #6b7286;
  }
  .cmd-buttons {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }
  .cmd-button {
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid rgba(90, 100, 130, 0.4);
    background: transparent;
    color: #e8e8e8;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .cmd-button.primary {
    background: #2b4d7a;
    border-color: #3d6ba8;
  }

  /* The minimized form. Small enough to forget about, obvious enough to find. */
  .cmd-puck {
    position: absolute;
    z-index: 45;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    border: 1px solid rgba(140, 155, 190, 0.28);
    background: rgba(20, 23, 33, 0.55);
    backdrop-filter: blur(20px) saturate(155%);
    -webkit-backdrop-filter: blur(20px) saturate(155%);
    color: #9ec5ff;
    font-size: 15px;
    cursor: pointer;
  }

  .term-menu {
    position: fixed;
    z-index: 60;
    min-width: 150px;
    padding: 4px;
    border: 1px solid #333;
    border-radius: 8px;
    background: #1a1c20;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
  }
  .term-menu-item {
    text-align: left;
    padding: 6px 12px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: #e8e8e8;
    font-size: 13px;
    cursor: pointer;
  }
  .term-menu-item:hover:not(:disabled) {
    background: #2b4d7a;
  }
  .term-menu-item:disabled {
    color: #5f6368;
    cursor: default;
  }
  #server-offer {
    position: absolute;
    right: 16px;
    bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border: 1px solid #333;
    border-radius: 8px;
    background: rgba(22, 24, 29, 0.97);
    font-size: 12px;
    z-index: 35;
  }
  #staged {
    position: absolute;
    inset: 0;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 4px;
    background: rgba(16, 18, 22, 0.97);
    padding: 32px;
    z-index: 40;
  }
  #staged h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  #staged-source {
    color: #9aa0a6;
    font-size: 12px;
    margin: 0 0 12px;
    max-width: 70ch;
    overflow-wrap: anywhere;
  }
  #staged-text {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    background: #16181d;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 12px 14px;
    margin: 0;
    max-width: 80ch;
    max-height: 40vh;
    overflow: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .staged-note {
    color: #e8b339;
    font-size: 12px;
    margin: 12px 0 0;
  }
  #staged-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .staged-button {
    padding: 7px 16px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #1a1c20;
    color: #e8e8e8;
    font-size: 13px;
    cursor: pointer;
  }
  .staged-button.primary {
    background: #2b4d7a;
    border-color: #3d6ba8;
  }
  #recovery {
    position: absolute;
    inset: 0;
    z-index: 10;
    background: #12131a;
    display: grid;
    place-content: center;
    gap: 14px;
    font:
      14px/1.6 -apple-system,
      BlinkMacSystemFont,
      sans-serif;
    color: #d5d8e2;
    text-align: center;
    padding: 40px;
  }
  #recovery h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
  }
  #recovery-detail {
    display: grid;
    gap: 4px;
    margin: 4px 0 6px;
    font:
      12px/1.6 ui-monospace,
      SFMono-Regular,
      Menlo,
      monospace;
  }
  .recovery-row {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  .recovery-key {
    color: #6f758a;
    min-width: 110px;
    text-align: right;
  }
  .recovery-value {
    color: #d5d8e2;
    text-align: left;
  }
  #recovery-actions {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  #recovery p {
    margin: 0;
    color: #8b91a6;
  }

  /* --- launcher and palette -------------------------------------------- */
  #overlays {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 8;
  }
  #overlays > * {
    pointer-events: auto;
  }

  /*
   * Part of the page, not a window on top of it.
   *
   * It used to be a centred card with its own background, its own border, and its own
   * scrollbar, which made it look like a dialog you had to deal with before you could reach
   * the terminal. It is not: there is a live shell behind it from the moment the tab opens,
   * and this is only here because there is no output yet.
   *
   * So: no card, no second scrollbar, and anchored to the top so the prompt keeps the bottom of
   * the window, where a terminal's input belongs.
   */
  /* `hidden` must win over the display below, or dismissing the panel does nothing at all.
     The recovery overlay had this exact bug once already. */
  .launcher[hidden] {
    display: none;
  }
  .launcher {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    /* Stops short of the bottom, leaving the prompt visible underneath. */
    bottom: 4.5rem;
    padding: 14px 18px 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: transparent;
    border: 0;
    overflow: hidden;
  }
  /**
   * The part that scrolls, and the part that fades.
   *
   * Both used to be on the panel itself, which meant the last thing rendered was always the
   * thing being faded out, and a long list pushed it past the edge entirely.
   */
  .launcher-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding-bottom: 6px;
    scrollbar-width: thin;
    scrollbar-color: rgba(90, 100, 130, 0.45) transparent;
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent);
    mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent);
  }

  .launcher-section {
    margin-bottom: 10px;
  }
  /* Quiet. A heading here is a label, not a banner. */
  .launcher-heading {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #5f6672;
    margin: 0 0 4px;
    font-weight: 600;
  }
  .launcher-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .launcher-input {
    width: 100%;
    box-sizing: border-box;
    background: #12131a;
    border: 1px solid #333849;
    border-radius: 6px;
    color: #d5d8e2;
    padding: 7px 10px;
    font:
      13px/1.4 ui-monospace,
      SFMono-Regular,
      Menlo,
      monospace;
  }
  .launcher-input:focus {
    outline: none;
    border-color: #4a5573;
  }
  .launcher-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
  }
  .launcher-chip {
    background: #262a38;
    border: 1px solid #343a4d;
    color: #d5d8e2;
    border-radius: 6px;
    padding: 5px 11px;
    font-size: 12px;
    cursor: pointer;
  }
  .launcher-chip:hover {
    background: #2f3547;
    border-color: #4a5573;
  }
  .launcher-chip.agent {
    background: #24384a;
    border-color: #3c5a76;
    color: #a8cbf0;
  }
  .launcher-chip.agent:hover {
    background: #2d4459;
  }
  .launcher-note {
    color: #6f758a;
    font-size: 11px;
    margin-top: 6px;
  }

  .launcher-row-wrap {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .launcher-badge {
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 999px;
    background: #23262c;
    color: #9aa0a6;
    margin-left: auto;
  }
  .launcher-row-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .launcher-chip.project {
    font-size: 11px;
    padding: 2px 8px;
    background: #1d3557;
    border-color: #2b4d7a;
  }
  /* An unreviewed config is marked, never styled to look already approved. */
  .launcher-chip.project.unreviewed {
    background: #4a3210;
    border-color: #7a5518;
  }
  .launcher-chip.primary {
    background: #2b4d7a;
    border-color: #3d6ba8;
  }
  .launcher-project {
    border: 1px solid #333;
    border-radius: 6px;
    padding: 10px 12px;
    margin: 0 0 6px 12px;
    background: #16181d;
  }
  .launcher-project-title {
    font-weight: 600;
    margin-bottom: 4px;
  }
  .launcher-project-warn {
    color: #e8b339;
    font-size: 12px;
    margin-bottom: 6px;
  }
  .launcher-project-commands {
    margin: 8px 0;
    padding-left: 18px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: #d6d6d6;
    overflow-x: auto;
  }
  /* One line, always. A row that wraps turns a list into a paragraph. */
  .launcher-row {
    flex: 1;
    display: flex;
    align-items: baseline;
    gap: 10px;
    background: transparent;
    border: 0;
    border-radius: 5px;
    color: inherit;
    text-align: left;
    padding: 3px 6px;
    cursor: pointer;
    font: inherit;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
  }
  .launcher-row > * {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .launcher-row:hover {
    background: #262a38;
  }
  .launcher-strong {
    font-weight: 600;
    white-space: nowrap;
  }
  .launcher-dim {
    color: #6f758a;
    font-size: 11.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .launcher-icon {
    background: transparent;
    border: 0;
    color: #5f6579;
    cursor: pointer;
    font-size: 13px;
    padding: 4px 6px;
    border-radius: 4px;
  }
  .launcher-icon:hover {
    color: #d5d8e2;
    background: #262a38;
  }
  .launcher-icon.on {
    color: #e8c26a;
  }
  /* Shown only when Tab could not decide, so it is never permanent furniture. */
  .launcher-completions {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .launcher-completion {
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid rgba(90, 100, 130, 0.32);
    background: rgba(26, 28, 38, 0.7);
    color: #9ec5ff;
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
  }
  .launcher-completion:hover {
    border-color: #3d6ba8;
    color: #e8e8e8;
  }

  /* Outside the scrolling area, so it is never the thing that gets cut off. */
  .launcher-hint {
    flex: none;
    color: #6f758a;
    font-size: 11.5px;
    border-top: 1px solid #262a38;
    padding: 8px 0 10px;
    background: linear-gradient(to top, rgba(16, 18, 22, 0.92), transparent);
  }

  .palette {
    position: absolute;
    left: 50%;
    top: 60px;
    transform: translateX(-50%);
    width: min(700px, calc(100% - 48px));
    background: #1a1c26;
    border: 1px solid #2f3346;
    border-radius: 10px;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.6);
    overflow: hidden;
    font:
      13px/1.5 -apple-system,
      BlinkMacSystemFont,
      sans-serif;
    color: #d5d8e2;
  }
  .palette-input {
    width: 100%;
    box-sizing: border-box;
    background: #12131a;
    border: 0;
    border-bottom: 1px solid #2f3346;
    color: #d5d8e2;
    padding: 11px 14px;
    font:
      13px/1.4 -apple-system,
      BlinkMacSystemFont,
      sans-serif;
  }
  .palette-input:focus {
    outline: none;
  }
  .palette-list {
    max-height: 320px;
    overflow-y: auto;
  }
  .palette-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 7px 14px;
    cursor: pointer;
  }
  /*
   * Selection is now a step of its own, so it has to be unmistakable: an accent bar as well as
   * a background, because a background alone is easy to lose against a long list.
   */
  .palette-row.selected {
    background: #31384f;
    box-shadow: inset 3px 0 0 #7fa8d8;
  }
  /* Hover is deliberately weaker than selection. They mean different things now. */
  .palette-row:hover:not(.selected) {
    background: #23262c;
  }
  .palette-row:hover {
    background: #262a38;
  }
  .palette-command {
    flex: 1;
    font:
      12.5px/1.4 ui-monospace,
      SFMono-Regular,
      Menlo,
      monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .palette-row.failed .palette-command {
    color: #e0776b;
  }
  .palette-row.is-merge .palette-command {
    color: #8ab4f8;
  }
  .palette-row.is-saved .palette-command {
    color: #8ae2a0;
  }
  .palette-meta {
    color: #6f758a;
    font-size: 11px;
    white-space: nowrap;
  }
  .palette-delete {
    background: transparent;
    border: 0;
    color: #5f6579;
    cursor: pointer;
  }
  .palette-delete:hover {
    color: #e0776b;
  }
  .palette-empty {
    padding: 18px 14px;
    color: #6f758a;
    font-size: 12px;
  }
  .palette-scopes {
    display: flex;
    gap: 6px;
    padding: 8px 12px 0;
  }
  .palette-scope {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid #333;
    background: #1a1c20;
    color: #9aa0a6;
    cursor: pointer;
  }
  .palette-scope.on {
    background: #2b4d7a;
    border-color: #3d6ba8;
    color: #e8e8e8;
  }
  .palette-status {
    padding: 6px 12px 0;
    font-size: 11px;
    color: #7fa8d8;
  }
  .palette-action {
    font-size: 11px;
    margin-left: 6px;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid #333;
    background: #1a1c20;
    color: #c9c9c9;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .palette-action:hover {
    background: #2b4d7a;
    border-color: #3d6ba8;
  }
  .palette-row.is-action .palette-command {
    color: #9ec5ff;
  }
  .palette-fill {
    border-top: 1px solid #2a2d33;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .palette-fill-title {
    font-weight: 600;
    font-size: 13px;
  }
  .palette-fill-preview {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    background: #16181d;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 8px 10px;
    margin: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    max-height: 20vh;
    overflow: auto;
  }
  .palette-fill-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #9aa0a6;
  }
  .palette-fill-row > span {
    min-width: 90px;
  }
  .palette-fill-input {
    flex: 1;
    padding: 5px 8px;
    border-radius: 5px;
    border: 1px solid #333;
    background: #101216;
    color: #e8e8e8;
    font-size: 12px;
  }
  .palette-action:disabled {
    color: #5f6368;
    cursor: default;
  }
  .palette-action.on {
    color: #e8b339;
  }
  .palette-more {
    display: block;
    width: 100%;
    padding: 8px;
    background: transparent;
    border: 0;
    border-top: 1px solid #2a2d33;
    color: #7fa8d8;
    font-size: 12px;
    cursor: pointer;
  }
  .palette-more:hover {
    background: #1d2129;
  }
  .palette-footer {
    border-top: 1px solid #2f3346;
    padding: 8px 14px;
    color: #6f758a;
    font-size: 11px;
  }
</style>
<body>
  <div id="status" hidden></div>
  <div id="terminal"></div>
  <div id="overlays"></div>
  <div id="recovery" hidden>
    <h1 id="recovery-reason">This terminal session expired.</h1>
    <p>Nothing was run automatically.</p>
    <div id="recovery-detail"></div>
    <div id="recovery-actions"></div>
  </div>
  <button id="cmd-button" title="Commands (Command+K)">⌘</button>
  <button id="clear-undo" hidden title="Bring back what was just cleared">Undo clear</button>

  <div id="server-offer" hidden>
    <span id="server-text"></span>
    <button id="server-open" class="staged-button primary"></button>
    <button id="server-dismiss" class="staged-button">Dismiss</button>
  </div>
  <div id="staged" hidden>
    <h1>Send this to the terminal?</h1>
    <p id="staged-source"></p>
    <pre id="staged-text"></pre>
    <p class="staged-note">
      It will be placed at the prompt, not run. Press Enter yourself once you have read it.
    </p>
    <div id="staged-actions">
      <button id="staged-accept" class="staged-button primary">Place at the prompt</button>
      <button id="staged-cancel" class="staged-button">Discard</button>
    </div>
  </div>
  <script type="module" src="terminal.js"></script>
</body>
