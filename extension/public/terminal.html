<!doctype html>
<meta charset="utf-8" />
<title>Terminal</title>
<link rel="stylesheet" href="xterm.css" />
<link rel="icon" id="favicon" />
<style>
  :root {
    color-scheme: dark;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: #12131a;
    overflow: hidden;
  }
  /* --- split layout ---------------------------------------------------- */
  .split-node {
    display: flex;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
  }
  .split-horizontal {
    flex-direction: row;
  }
  .split-vertical {
    flex-direction: column;
  }
  .split-node.maximized > .pane {
    flex: 1 1 100%;
  }

  .pane {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    flex: 1 1 0;
    border: 1px solid transparent;
    border-radius: 4px;
  }
  /* The focused pane is the one receiving keystrokes, so it has to be obvious at a glance. */
  .pane.focused {
    border-color: #4a5573;
  }
  .pane-terminal {
    position: absolute;
    inset: 0;
    padding: 4px 6px;
  }

  .divider {
    flex: 0 0 6px;
    background: #1c1e28;
    position: relative;
  }
  .divider::after {
    content: '';
    position: absolute;
    inset: -3px;
  }
  .divider-horizontal {
    cursor: col-resize;
  }
  .divider-vertical {
    cursor: row-resize;
  }
  .divider:hover,
  .divider.dragging {
    background: #5b6a92;
  }

  #terminal {
    position: absolute;
    inset: 0;
    padding: 6px 8px;
  }
  .xterm-viewport::-webkit-scrollbar {
    width: 9px;
  }
  .xterm-viewport::-webkit-scrollbar-thumb {
    background: #333849;
    border-radius: 5px;
  }
  #status {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    z-index: 5;
    font:
      12px/1.9 -apple-system,
      BlinkMacSystemFont,
      sans-serif;
    text-align: center;
    color: #12131a;
  }
  #status[data-tone='warn'] {
    background: #e8c26a;
  }
  #status[data-tone='error'] {
    background: #e0776b;
  }
  /* An explicit display value overrides the `hidden` attribute, so without these rules this
     overlay covered a perfectly healthy terminal permanently. */
  #recovery[hidden],
  #status[hidden] {
    display: none;
  }
  /* Links only activate while Command is held, so the terminal stays a terminal. */
  body.cmd-held .xterm-screen {
    cursor: pointer;
  }
  #recovery {
    position: absolute;
    inset: 0;
    z-index: 10;
    background: #12131a;
    display: grid;
    place-content: center;
    gap: 14px;
    font:
      14px/1.6 -apple-system,
      BlinkMacSystemFont,
      sans-serif;
    color: #d5d8e2;
    text-align: center;
    padding: 40px;
  }
  #recovery h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
  }
  #recovery p {
    margin: 0;
    color: #8b91a6;
  }
</style>
<body>
  <div id="status" hidden></div>
  <div id="terminal"></div>
  <div id="recovery" hidden>
    <h1 id="recovery-reason">This terminal session expired.</h1>
    <p>The daemon no longer has this session. Nothing was run automatically.</p>
  </div>
  <script type="module" src="terminal.js"></script>
</body>
