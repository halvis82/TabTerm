<!doctype html>
<meta charset="utf-8" />
<title>Terminal</title>
<link rel="stylesheet" href="xterm.css" />
<link rel="icon" id="favicon" />
<style>
  /* The dark values, which are also the fallback. The theme sets these on the root at runtime,
     from the same table the terminal's own colors come from, so the interface and the terminal
     cannot end up disagreeing. See extension/src/terminal/themes.ts. */
  :root {
    color-scheme: dark;
    --bg: #0f1015;
    --panel: #1a1c20;
    --edge: #333;
    --text: #e8e8e8;
    --dim: #9aa1b8;
    --accent: var(--accent);
    --hover: #2b4d7a;
    --selected: #31405e;
    --selected-edge: #8fb6e8;
    --warn: #e8c26a;
  }
  :root[data-theme='light'] {
    color-scheme: light;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }
  /* --- split layout ---------------------------------------------------- */
  .split-node {
    display: flex;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
  }
  .split-horizontal {
    flex-direction: row;
  }
  .split-vertical {
    flex-direction: column;
  }
  .split-node.maximized > .pane {
    flex: 1 1 100%;
  }

  .pane {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    flex: 1 1 0;
    border: 1px solid transparent;
    border-radius: 4px;
    /* So the session name sizes itself against the pane rather than the window, which is what
       keeps it legible in a narrow one. Inline axis only: the pane is a flex item with a
       definite width, and containing the block axis too would make the terminal inside it lay
       out against nothing. */
    container-type: inline-size;
  }
  /* The focused pane is the one receiving keystrokes, so it has to be obvious at a glance. */
  .pane.focused {
    border-color: #4a5573;
  }
  .pane-terminal {
    position: absolute;
    inset: 0;
    padding: 4px 6px;
  }

  /* A quiet corner label. It must never compete with the terminal for attention. */
  .pane-time {
    position: absolute;
    right: 8px;
    bottom: 4px;
    font:
      10.5px/1.4 ui-monospace,
      SFMono-Regular,
      Menlo,
      monospace;
    color: #5f6579;
    background: var(--panel);
    padding: 1px 6px;
    border-radius: 4px;
    pointer-events: none;
    opacity: 0.85;
  }
  .pane:not(.focused) .pane-time {
    opacity: 0.5;
  }

  .divider {
    flex: 0 0 6px;
    background: #1c1e28;
    position: relative;
  }
  .divider::after {
    content: '';
    position: absolute;
    inset: -3px;
  }
  .divider-horizontal {
    cursor: col-resize;
  }
  .divider-vertical {
    cursor: row-resize;
  }
  .divider:hover,
  .divider.dragging {
    background: #5b6a92;
  }

  /*
   * A flex container, because its child is a flex item.
   *
   * A single-pane workspace renders one `.pane` directly here, with no `.split-node` between
   * them, and `.pane` is `flex: 1 1 0`. Against a block parent that resolves to zero height, so
   * the terminal collapsed to a few pixels and the tab looked simply dark. Splits were fine,
   * because a split does insert a flex wrapper -- which is why this survived: every test that
   * split a pane passed.
   */
  #terminal {
    position: absolute;
    inset: 0;
    padding: 6px 8px;
    display: flex;
    min-width: 0;
    min-height: 0;
  }

  /*
   * While the panel is up, the terminal keeps the bottom of the window.
   *
   * A terminal's input belongs at the bottom, and the panel is drawn in the space above it that
   * has no output in it yet. The terminal really is smaller here rather than being visually
   * shifted: the shell is told its true size, so what is on screen is what it thinks it has.
   */
  #terminal.panel-open {
    align-items: flex-end;
  }
  /**
   * The strip under the start screen, which grows upward when what is typed needs the room.
   *
   * A definite height rather than a cap: `flex: 1 1 0` against `align-items: flex-end` shrinks
   * to content, which is a couple of pixels, and `flex: 0 0 auto` alone sizes to content in
   * both directions, which collapsed it horizontally to nothing.
   *
   * The height is a variable so the page can raise it as a command outgrows one line. A long
   * one used to scroll inside a fixed box, which pushed the prompt off the top and left the
   * thing being typed with no visible beginning.
   */
  #terminal.panel-open > .pane,
  #terminal.panel-open > .split-node {
    flex: 0 0 auto;
    width: 100%;
    height: var(--strip-height, 4.5rem);
    transition: height 90ms ease-out;
  }
  .xterm-viewport::-webkit-scrollbar {
    width: 9px;
  }
  .xterm-viewport::-webkit-scrollbar-thumb {
    background: #333849;
    border-radius: 5px;
  }
  #status {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    z-index: 5;
    font:
      12px/1.9 -apple-system,
      BlinkMacSystemFont,
      sans-serif;
    text-align: center;
    color: #12131a;
  }
  #status[data-tone='warn'] {
    background: #e8c26a;
  }
  #status[data-tone='error'] {
    background: #e0776b;
  }
  /* An explicit display value overrides the `hidden` attribute, so without these rules this
     overlay covered a perfectly healthy terminal permanently. */
  #server-offer[hidden],
  #staged[hidden],
  #recovery[hidden],
  #status[hidden] {
    display: none;
  }
  /* Links only activate while Command is held, so the terminal stays a terminal. */
  /* The pointer belongs to the link under it, which xterm sets itself. Setting it for the whole
     screen the moment the modifier went down said "something here is clickable" without saying
     what, and it said it over blank space too. */
  /* --- reset confirmation ------------------------------------------------ */

  .reset {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .reset-card {
    width: min(440px, 100%);
    padding: 22px 22px 18px;
    border-radius: 14px;
    border: 1px solid rgba(255, 138, 122, 0.28);
    background: var(--panel);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  .reset-title {
    margin: 0 0 8px;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }
  .reset-body {
    margin: 0 0 10px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
  }
  .reset-warning {
    margin: 0 0 10px;
    padding: 7px 10px;
    border-radius: 8px;
    background: rgba(255, 200, 87, 0.1);
    color: #ffc857;
    font-size: 12px;
  }
  .reset-list {
    margin: 0 0 14px;
    padding-left: 18px;
    color: var(--dim);
    font-size: 12px;
    line-height: 1.7;
  }
  .reset-option {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 16px;
    color: var(--text);
    font-size: 12.5px;
    cursor: pointer;
  }
  .reset-option span {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .reset-option small {
    color: var(--dim);
    font-size: 11px;
  }
  .reset-option input {
    margin-top: 2px;
    width: 15px;
    height: 15px;
    accent-color: var(--accent);
  }
  .reset-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .reset-cancel,
  .reset-confirm {
    padding: 7px 14px;
    border-radius: 8px;
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }
  .reset-cancel {
    border: 1px solid rgba(90, 100, 130, 0.4);
    background: transparent;
    color: var(--text);
  }
  .reset-cancel:hover {
    border-color: var(--accent);
    color: var(--text);
  }
  /* The destructive one is never the default, and it looks like what it does. */
  .reset-confirm {
    border: 1px solid rgba(255, 138, 122, 0.45);
    background: rgba(255, 138, 122, 0.14);
    color: #ff8a7a;
  }
  .reset-confirm:hover {
    background: rgba(255, 138, 122, 0.24);
    color: #ffb3a8;
  }

  /* --- running sessions, on the start screen ----------------------------- */

  .sessions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 0 0 22px;
  }
  .sessions-heading {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .sessions-count {
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(122, 162, 247, 0.14);
    color: var(--accent);
    font-size: 10px;
    letter-spacing: 0;
  }

  /* Wide enough for a readable preview, and it reflows rather than scrolling sideways. */
  .session-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
    gap: 10px;
    /* Room for the lift on hover. Without it a card in the top row moved up under the edge of
       whatever is above and its top border was clipped off. */
    padding-top: 2px;
  }

  .session-grid.is-scrolling {
    max-height: 300px;
    overflow-y: auto;
    /* Same reason, and here it matters more: a scrolling box clips by definition. */
    padding-top: 3px;
    padding-right: 4px;
    /* Scoped to this list, so the scrollbar styling cannot leak into a terminal. */
    scrollbar-width: thin;
    scrollbar-color: rgba(90, 100, 130, 0.5) transparent;
  }
  .session-card {
    display: flex;
    flex-direction: column;
    /* The row is a fixed height and this fills it, rather than the other way round. */
    height: 100%;
    overflow: hidden;
    border-radius: 10px;
    border: 1px solid var(--edge);
    background: var(--panel);
    cursor: pointer;
    /* Only the cheap properties, so a grid of these never costs a frame. Height is not among
       them on purpose: a card that animates its own size makes the whole list move when the
       pointer crosses it. */
    transition:
      border-color 140ms ease,
      transform 140ms ease,
      background 140ms ease;
  }
  .session-card:hover,
  .session-card:focus-visible {
    /* The lift is what clipped the top border: the row it sits in has no room above it, so a
       card moving up went under the edge. The room is made below in `.session-grid`. */
    transform: translateY(-1px);
    border-color: var(--accent);
    background: var(--hover);
    outline: none;
  }

  /* Slimmer than it was: a name and a badge do not need the height of a paragraph. */
  .session-head {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 10px 4px;
  }
  .session-dot {
    flex: none;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--dim);
  }
  /* Attached, unattached and busy are the distinctions the list exists to draw. */
  .session-card[data-state='attached'] .session-dot {
    background: #8ab4f8;
    box-shadow: 0 0 0 3px rgba(138, 180, 248, 0.16);
  }
  .session-card[data-busy='true'] .session-dot {
    background: #6ee7a0;
    box-shadow: 0 0 0 3px rgba(110, 231, 160, 0.16);
    animation: session-pulse 1.6s ease-in-out infinite;
  }
  @keyframes session-pulse {
    50% {
      opacity: 0.45;
    }
  }
  /* Somebody who set their system to reduce motion means it. */
  @media (prefers-reduced-motion: reduce) {
    .session-card,
    .session-card[data-busy='true'] .session-dot {
      transition: none;
      animation: none;
    }
  }

  .session-title {
    flex: 1 1 auto;
    overflow: hidden;
    font-size: 12.5px;
    color: var(--text);
    text-overflow: ellipsis;
    white-space: nowrap;
    /* Truncated from the **left**, because the end of a path is the part that identifies it:
       `…/personal_coding/TabTerm` says more than `~/Documents/personal…`. */
    direction: rtl;
    /* And read in its own direction, which `direction: rtl` alone does not do.
       A path is a run of neutral characters as far as bidi is concerned, so `~/Downloads/test6`
       came out as `Downloads/test6/~`: the leading `~/` was reordered to the end, which reads as
       a path with a stray tilde on it rather than as a home directory. `plaintext` takes the
       paragraph direction from the first strong character instead, leaving the text alone while
       the box still clips on the left. */
    unicode-bidi: plaintext;
    text-align: left;
  }
  .session-badge {
    flex: none;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--hover);
    color: var(--dim);
    font-size: 9.5px;
    letter-spacing: 0.02em;
  }
  .session-card[data-state='attached'] .session-badge {
    /*
     * The accent behind it, not in front of it.
     *
     * Accent-on-hover is two tints of the same hue and measured 4.3 to 1 in light and 3.4 in
     * dark, which is under the line in both. This is the one badge that says a session is open
     * somewhere, so it should be the most legible thing on the card, not the least.
     */
    background: var(--accent);
    color: var(--bg);
  }

  /**
   * A miniature of the screen.
   *
   * Bottom aligned, because a terminal's newest line is at the bottom and a preview that grew
   * downward from the top would show the oldest thing it knows.
   */
  /**
   * A window onto the session, sized to show as much as it can rather than as little.
   *
   * The text is 6px against the old 10, which is 40 per cent smaller, and the box is 101px
   * against 88, which is 15 per cent taller. Together with a slimmer head and foot that is
   * roughly three times the text in a card that grew by an eighth.
   *
   * `line-height` is tight because these lines are being scanned for shape, not read: at this
   * size the leading is what wastes the room rather than the glyphs.
   */
  .session-screen {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    /* Fixed, and the card's height is built from it. Not `flex: 1`, which would make the card
       size the preview instead of the preview sizing the card. */
    flex: none;
    height: 101px;
    padding: 6px 10px;
    overflow: hidden;
    /* The same two colors the renderer paints with, so a picture of a terminal looks like one
       in every theme. Written out by hand before, which made light mode a white page covered in
       black rectangles. */
    background: var(--term-bg);
    border-top: 1px solid var(--edge);
    border-bottom: 1px solid var(--edge);
    color: var(--term-fg);
    font-family: inherit;
    font-size: 6px;
    line-height: 1.42;
    /* No fade at the top. It read as a smear rather than as depth, and over a light page it read
       as damage. The card's own edge already says where the miniature stops. */
  }
  /* Taller and readable here: this is the only thing left of the session, and it is being
     read rather than glanced at, so it does not take the card's miniature type size. */
  .recovery-screen {
    height: auto;
    max-height: 220px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid rgba(90, 100, 130, 0.2);
    font-size: 11px;
    line-height: 1.5;
  }
  .session-line {
    overflow: hidden;
    white-space: pre;
    text-overflow: clip;
  }
  /* The last line is the one that says what happened, so it reads as the live one. */
  .session-line:last-child {
    color: var(--text);
  }
  .session-screen.is-empty {
    justify-content: center;
    /* Quiet, not unreadable. Hardcoded, it measured 3 to 1 against the terminal behind it. */
    color: var(--dim);
    font-style: italic;
    mask-image: none;
    -webkit-mask-image: none;
  }

  /* Slimmer: three short facts, none of which need room around them. */
  .session-foot {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px 5px;
    font-size: 10px;
    color: var(--dim);
  }
  .session-what {
    flex: 1 1 auto;
    overflow: hidden;
    color: var(--dim);
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .session-when {
    flex: none;
  }
  .session-close {
    flex: none;
    /* Big enough to hit. It was an 18px square holding a glyph, which is below what a pointer
       can be expected to find, let alone hit on the first try. */
    width: 26px;
    height: 26px;
    font-size: 15px;
    padding: 0;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: #5b6070;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity 120ms ease;
  }
  /* Hidden until the card is under the pointer: ending a session is not a thing to invite. */
  .session-card:hover .session-close,
  .session-card:focus-within .session-close {
    opacity: 1;
  }
  .session-close:hover {
    background: rgba(255, 138, 122, 0.14);
    color: #ff8a7a;
  }

  /* --- command panel ---------------------------------------------------- */

  /* The button that opens it. Small, out of the way, and always in the same place. */
  #cmd-button {
    position: absolute;
    /* Tucked into the corner, clear of the path box which starts just below and runs to the
       right edge. At the old offsets the two overlapped. */
    top: 4px;
    right: 4px;
    z-index: 30;
    width: 26px;
    height: 26px;
    border-radius: 7px;
    border: 1px solid #2f3346;
    background: var(--panel);
    color: var(--dim);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  /* Out of the way of the bar the rightmost pane grew.
     The button lives in the tab's top right corner and the bars start at the same line, so in a
     split tab it sat directly on top of that pane's close cross. It drops below the bars, which
     is a place nothing else uses and keeps it in the same corner it has always been in. */
  /* A sibling combinator, because the button is not inside the layout: it sits beside it in the
     document, so a descendant selector matched nothing at all and the rule looked wrong rather
     than absent. */
  #terminal.many-panes ~ #cmd-button {
    top: 28px;
  }
  #cmd-button:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  /* Under the menu icon, and only there for a few seconds after a clear. */
  #clear-undo {
    position: absolute;
    top: 40px;
    right: 10px;
    z-index: 30;
    padding: 4px 9px;
    border-radius: 7px;
    border: 1px solid #2f3346;
    background: var(--panel);
    color: var(--accent);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  #clear-undo:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  /* Under the menu icon, next to where the undo for a clear appears, and the same shape. */
  /*
   * `display: flex` beats the browser's own rule for the hidden attribute, so this has to say
   * so itself. Without it the element is an invisible empty box at the top right, over the
   * marker rail, swallowing the clicks meant for it.
   */
  #undo-offer[hidden] {
    display: none;
  }
  /*
   * The same trap, guarded for everything: an element given a display of its own stops obeying
   * the hidden attribute, and an invisible box that still takes clicks is a defect nobody can
   * see. This one cost the marker rail its clicks and was found by a suite that had nothing to
   * do with either feature.
   */
  [hidden] {
    display: none !important;
  }
  #undo-offer {
    position: absolute;
    top: 40px;
    right: 10px;
    z-index: 30;
    display: flex;
    align-items: stretch;
    border-radius: 7px;
    border: 1px solid #2f3346;
    background: var(--panel);
    backdrop-filter: blur(6px);
    overflow: hidden;
  }
  /* Both at once would sit on top of each other, and a clear is the more urgent of the two. */
  #clear-undo:not([hidden]) ~ #undo-offer {
    top: 72px;
  }
  #undo-offer-do,
  #undo-offer-hide {
    padding: 4px 9px;
    border: 0;
    background: transparent;
    color: var(--accent);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  #undo-offer-hide {
    padding-left: 6px;
    padding-right: 8px;
    border-left: 1px solid #2f3346;
    color: var(--dim);
  }
  #undo-offer-do:hover {
    color: var(--text);
  }
  #undo-offer-hide:hover {
    color: #ff8a7a;
  }

  /*
   * Translucent, because there is terminal output behind it and hiding that is the one thing a
   * terminal panel must not do. The blur keeps it readable over busy output without making it
   * opaque.
   */
  .cmd-panel {
    position: absolute;
    z-index: 45;
    width: 460px;
    max-height: min(560px, calc(100% - 24px));
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(140, 155, 190, 0.28);
    border-radius: 12px;
    /*
     * Genuinely see-through. 0.82 was opaque enough that the blur behind it made no difference,
     * which is the same as not being translucent at all. The blur does the legibility work so
     * the fill can stay light.
     */
    /*
     * Translucent on purpose: this panel sits over a running terminal, and output behind it
     * staying readable is the reason it is a panel rather than a page. Built from the theme's
     * panel color so it is light in light mode, rather than the dark wash it used to hardcode.
     */
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter: blur(26px) saturate(155%);
    -webkit-backdrop-filter: blur(26px) saturate(155%);
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
    overflow: hidden;
  }
  .cmd-panel[hidden],
  .cmd-puck[hidden] {
    display: none;
  }

  .cmd-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    cursor: grab;
    border-bottom: 1px solid rgba(140, 155, 190, 0.16);
  }
  .cmd-header:active {
    cursor: grabbing;
  }
  .cmd-tabs {
    display: flex;
    gap: 4px;
  }
  .cmd-tab {
    font: inherit;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
  }
  .cmd-tab.on {
    /* The accent behind it rather than a wash of it, so the chosen tab is the most legible
       thing in the row instead of the least. A tint of the accent under the theme's text colour
       measured 2.9 to 1. */
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }

  .cmd-search {
    margin: 8px;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid rgba(140, 155, 190, 0.22);
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 13px;
  }
  .cmd-search:focus {
    outline: none;
    border-color: var(--accent);
  }

  .cmd-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 6px 6px;
  }
  .cmd-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .cmd-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
  }
  .cmd-row-label {
    flex: 0 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 13px;
  }
  .cmd-row.is-action .cmd-row-label {
    color: var(--accent);
  }
  .cmd-row.failed .cmd-row-label {
    color: #e8908f;
  }
  .cmd-row-meta {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 11px;
    color: var(--dim);
  }
  /**
   * A label above a group of actions, which is not a row and does not behave like one.
   *
   * The Actions tab was one flat list, so `Make an action` sat between two things that do
   * something and looked exactly like them, and what somebody had written sat among what ships.
   */
  .cmd-heading {
    padding: 10px 12px 4px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .cmd-heading:first-child {
    padding-top: 4px;
  }
  /* The key an action answers to, read from the same store the settings panel binds it in. */
  .cmd-row-keys {
    flex: none;
    margin-left: 8px;
    font-size: 11px;
    color: var(--dim);
  }
  /*
   * At the end of the row, and always there.
   *
   * They appeared on hover, which reads as tidier and means the only way to discover that an
   * action can be edited is to happen to point at it.
   */
  .cmd-row-controls {
    flex: none;
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .cmd-row-edit,
  .cmd-row-remove {
    flex: none;
    padding: 0 5px;
    border: 0;
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .cmd-row-edit:hover {
    color: var(--accent);
  }
  .cmd-row-remove:hover {
    color: #ff8a7a;
  }
  /* A link leaves the tab, so it is not drawn like the things that act inside it. */
  .cmd-row.is-link {
    border-top: 1px solid rgba(90, 100, 130, 0.2);
    margin-top: 4px;
    padding-top: 8px;
    color: var(--dim);
  }

  /*
   * A question asked in place, above the list, rather than in a window over it.
   *
   * It replaces nothing and covers nothing: the row that raised it is still visible underneath,
   * which is the point of asking there rather than in a dialog.
   */
  .cmd-ask {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 6px;
    padding: 7px 9px;
    border-radius: 7px;
    border: 1px solid rgba(224, 200, 121, 0.35);
    background: rgba(224, 200, 121, 0.08);
    font-size: 12px;
  }
  .cmd-ask-text {
    flex: 1 1 auto;
    min-width: 0;
    color: var(--text);
  }

  /* Selection carries an accent bar as well as a background: it is a step of its own. */
  .cmd-row.selected {
    background: var(--selected);
    box-shadow: inset 3px 0 0 var(--selected-edge);
  }
  .cmd-row:hover:not(.selected) {
    background: rgba(140, 155, 190, 0.12);
  }

  /* A visible marker, so an abbreviation is discoverable from the list. */
  .cmd-hotstring {
    flex: 0 0 auto;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(61, 107, 168, 0.3);
    color: var(--accent);
  }

  .cmd-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 10px;
    border-top: 1px solid rgba(140, 155, 190, 0.16);
    font-size: 11px;
    color: var(--dim);
  }
  .cmd-hints {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cmd-icon {
    flex: 0 0 auto;
    background: transparent;
    border: 0;
    color: var(--dim);
    font-size: 13px;
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 5px;
  }
  /* The gear is the one control in the footer and it was rendered at the same size as a hint,
     which made it hard to find at all. It is a target, so it is sized like one. */
  /* A kept command reads as kept, rather than as an invitation to keep it again. */
  .cmd-flash {
    position: fixed;
    z-index: 90;
    padding: 7px 13px;
    border-radius: 8px;
    border: 1px solid var(--edge);
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    pointer-events: none;
    animation: cmd-flash-out 0.9s ease forwards;
  }
  @keyframes cmd-flash-out {
    0% {
      opacity: 0;
      transform: translateY(4px);
    }
    18% {
      opacity: 1;
      transform: translateY(0);
    }
    72% {
      opacity: 1;
    }
    100% {
      opacity: 0;
    }
  }
  /* A word rather than a glyph: it is an action with a destination, and an icon would need
     explaining. Quiet until the row is hovered or selected, so a list of ten does not shout. */
  .cmd-jump {
    font-size: 11px;
    color: var(--dim);
    opacity: 0.55;
  }
  .cmd-row:hover .cmd-jump,
  .cmd-row.selected .cmd-jump {
    opacity: 1;
  }
  /* The theme's own amber, not a gold written out here: on white the gold measured 1.7 to 1,
     which is a star you can only see if you already know it is lit. */
  .cmd-star.on {
    color: var(--warn);
  }
  .cmd-gear {
    font-size: 19px;
    padding: 2px 8px;
    color: var(--dim);
    border-radius: 6px;
  }
  /* Lit while settings are open, the way a tab is lit while you are on it. */
  .cmd-gear.on {
    /* The same rule as the chosen tab: the accent behind it, not a wash of it under the text.
       A tint measured 2.9 to 1, which for the control that says where you are is not enough. */
    color: var(--bg);
    background: var(--accent);
  }
  .cmd-icon:hover {
    color: var(--text);
    background: rgba(90, 100, 130, 0.25);
  }

  .cmd-stats {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px;
  }
  .cmd-figures {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .cmd-figure {
    padding: 7px 9px;
    border-radius: 8px;
    background: rgba(140, 155, 190, 0.1);
  }
  .cmd-figure-value {
    font-size: 15px;
    color: var(--text);
  }
  .cmd-figure-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--dim);
    margin-top: 2px;
  }
  .cmd-stat-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .cmd-stat-row {
    display: flex;
    align-items: baseline;
    gap: 9px;
    padding: 3px 6px;
    border-radius: 5px;
    font-size: 12px;
  }
  .cmd-stat-row:hover {
    background: rgba(140, 155, 190, 0.1);
  }
  .cmd-stat-row.failed .cmd-stat-command {
    color: #e8908f;
  }
  /* Time and duration never truncate: reading a session back is usually about what was slow. */
  .cmd-stat-time {
    flex: 0 0 auto;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .cmd-stat-command {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--term-fg);
  }
  .cmd-stat-duration {
    flex: 0 0 auto;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .cmd-keys {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 0 8px;
  }
  .cmd-key-row {
    display: flex;
    gap: 10px;
    font-size: 12px;
    color: var(--dim);
  }
  .cmd-key-row kbd {
    flex: 0 0 78px;
    font-family: inherit;
    color: var(--accent);
  }

  .cmd-empty,
  .cmd-note {
    padding: 10px 8px;
    font-size: 12px;
    color: var(--dim);
  }
  .cmd-add {
    margin: 4px 2px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px dashed var(--edge);
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    text-align: left;
    cursor: pointer;
  }
  .cmd-add:hover {
    color: var(--text);
    border-color: var(--accent);
  }

  .cmd-edit {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 8px;
  }
  .cmd-field {
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 11px;
    color: var(--dim);
  }
  .cmd-field input,
  .cmd-field select {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid rgba(90, 100, 130, 0.35);
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 13px;
  }

  /* --- settings -------------------------------------------------------- */
  /**
   * One type scale, three sizes, and that is all.
   *
   * The panel had five: an 11px label over a 13px control beside a 12px switch with a 10.5px
   * note under it and a 12px heading above. Nothing lined up and nothing read as belonging to
   * anything, which is what "hard to tell what belongs to what" was describing.
   *
   *   heading  11px, uppercase, dim      what this group is about
   *   label    13px, bright              the thing itself
   *   desc     12px, dim                 what it means, on its own line
   */
  .cmd-settings {
    display: flex;
    flex-direction: column;
    gap: 22px;
    padding: 14px 12px 16px;
  }
  .set-section {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .set-heading {
    margin: 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .set-field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
  }
  .set-label {
    font-size: 13px;
    color: var(--text);
    line-height: 1.35;
  }
  .set-desc {
    margin: 0;
    font-size: 12px;
    color: var(--dim);
    line-height: 1.45;
  }
  /* A text box in settings is drawn like the select beside it, so the panel reads as one thing. */
  .set-field .set-input {
    margin-top: 2px;
    padding: 7px 9px;
    border-radius: 7px;
    border: 1px solid rgba(90, 100, 130, 0.35);
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    font-family: var(--mono, ui-monospace, SFMono-Regular, Menlo, monospace);
  }
  .set-field .set-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .set-field select {
    margin-top: 2px;
    padding: 7px 9px;
    border-radius: 7px;
    border: 1px solid rgba(90, 100, 130, 0.35);
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 13px;
  }
  /* Label on the left, switch on the right, descriptions under the label where they belong. */
  .set-toggle {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    cursor: pointer;
  }
  .set-toggle-text {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .set-toggle input[type='checkbox'] {
    flex: none;
    margin-top: 1px;
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  /* Belongs to the switch above it, and says so by sitting under it. */
  .set-nested {
    margin-left: 14px;
    padding-left: 12px;
    border-left: 1px solid rgba(90, 100, 130, 0.22);
  }
  .set-section .cmd-keys {
    margin: 0;
  }
  .set-section .cmd-button {
    align-self: flex-start;
  }
  /* The two that cannot be taken back say so before they are pressed. */
  /* One row per shortcut: what it does, the keys, and why a choice was refused. */
  .set-keys {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  /*
   * Name, keys, and a quiet way to take the keys away, all on one line.
   *
   * The clear button had no rule of its own, so it fell into the first column of a two column
   * grid and became a full width bar under every shortcut: five of them down the settings page,
   * each as big as the thing it belonged to. It is a third column now, and it reads as an aside
   * rather than as an action of equal weight.
   */
  .set-key-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 8px 8px;
  }
  .set-key-clear {
    padding: 3px 8px;
    font-size: 11px;
    color: var(--dim);
    border-color: transparent;
    background: transparent;
  }
  .set-key-clear:hover {
    color: var(--text);
    border-color: var(--edge);
    background: var(--hover);
  }
  /* The problem line belongs under the name, across the whole row, not squeezed into a column. */
  .set-key-problem {
    grid-column: 1 / -1;
  }
  .set-key-problem:empty {
    display: none;
  }
  .cmd-button.set-key {
    min-width: 96px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .cmd-button.set-key[data-recording='yes'] {
    border-color: var(--accent);
    color: var(--accent);
  }
  .set-key-problem {
    grid-column: 1 / -1;
    color: #e8c26a;
  }
  .set-danger-row {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 3px;
  }
  .cmd-button.is-warning {
    border-color: var(--warn);
    color: var(--warn);
  }
  .cmd-button.is-warning:hover {
    background: rgba(232, 194, 106, 0.14);
  }
  .cmd-button.is-grave {
    border-color: var(--danger);
    color: var(--danger);
  }
  .cmd-button.is-grave:hover {
    background: rgba(255, 138, 122, 0.16);
  }

  .cmd-dim {
    color: #6b7286;
  }
  .cmd-buttons {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }
  .cmd-button {
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid rgba(90, 100, 130, 0.4);
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .cmd-button.primary {
    background: var(--hover);
    border-color: var(--accent);
  }

  /* The minimized form. Small enough to forget about, obvious enough to find. */
  .cmd-puck {
    position: absolute;
    z-index: 45;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    border: 1px solid rgba(140, 155, 190, 0.28);
    background: var(--panel);
    backdrop-filter: blur(20px) saturate(155%);
    -webkit-backdrop-filter: blur(20px) saturate(155%);
    color: var(--accent);
    font-size: 15px;
    cursor: pointer;
  }

  /*
   * A menu that is taller than the window scrolls rather than running off it.
   *
   * The list grew when the actions joined it, and on a short window the bottom entries went off
   * the screen where nothing could reach them. Positioning alone cannot solve that: past a point
   * there is no position that fits.
   */
  /*
   * A tab that has not worked out what it is yet shows neither half of itself.
   *
   * `visibility`, not `display`: a pane with no box cannot be measured, and a size nobody
   * measured is the other thing that goes wrong on a tab that has just opened.
   */
  .deciding .pane {
    visibility: hidden;
  }

  .term-menu {
    position: fixed;
    z-index: 60;
    min-width: 150px;
    max-height: calc(100vh - 16px);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 4px;
    border: 1px solid var(--edge);
    border-radius: 8px;
    background: var(--panel);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    scrollbar-width: thin;
    scrollbar-color: rgba(90, 100, 130, 0.45) transparent;
  }
  .term-menu-item {
    flex: none;
  }
  .term-menu-item {
    text-align: left;
    padding: 6px 12px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  /* An entry that carries its color beside it. The label takes the width so the swatch stays
     on the right edge, where it reads as a setting for the entry rather than a second entry. */
  .term-menu-item.is-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .term-menu-tick {
    color: var(--accent);
    font-size: 12px;
    width: 10px;
    text-align: right;
  }
  .term-menu-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .term-menu-row .term-menu-item {
    flex: 1 1 auto;
  }
  .term-menu-swatch {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    margin-right: 6px;
    padding: 0;
    border-radius: 4px;
    border: 1px solid #4a4a4a;
    cursor: pointer;
  }
  .term-menu-swatch:disabled {
    opacity: 0.35;
    cursor: default;
  }

  /* --- the color picker, used everywhere a color is chosen ---------------- */
  /* The same three parts wherever a color is chosen: the color as it stands, the map, and the
     last five used for this job. Floating beside whatever opened it, or sitting inside a form. */
  .color-picker {
    position: fixed;
    z-index: 80;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--edge);
    background: var(--panel);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  .color-picker.is-inline {
    position: static;
    padding: 0;
    border: 0;
    background: transparent;
    box-shadow: none;
  }
  .color-picker-current {
    height: 22px;
    border-radius: 5px;
    border: 1px solid #3a3a3a;
  }
  .color-picker-map {
    width: 190px;
    height: 110px;
    border-radius: 6px;
    border: 1px solid var(--edge);
    cursor: crosshair;
  }
  .color-picker-recents {
    display: flex;
    gap: 5px;
  }
  .color-picker-swatch {
    width: 30px;
    height: 22px;
    padding: 0;
    border-radius: 5px;
    border: 1px solid #3a3a3a;
    cursor: pointer;
  }
  /* Drawn, not omitted, so the row is the same shape before anything has been chosen and a
     color picked by position stays where it was. */
  .color-picker-swatch.is-empty {
    background: #232529;
    border-style: dashed;
    cursor: default;
  }

  .term-menu-item:hover:not(:disabled) {
    background: var(--hover);
  }
  .term-menu-item:disabled {
    color: #5f6368;
    cursor: default;
  }
  /* Landmarks beside the scrollbar. Inside it rather than over it: Chrome handles a scrollbar
     click itself and dispatches no DOM event, so markers drawn on top of one can be seen and
     never clicked. */
  .marker-rail {
    position: absolute;
    /* Clear of the command button, which sits in the same corner and would swallow the clicks
       meant for the topmost landmarks. */
    top: 34px;
    bottom: 4px;
    right: 11px;
    width: 6px;
    z-index: 5;
    display: none;
  }
  .marker-rail.has-markers {
    display: block;
  }
  .marker-pip {
    position: absolute;
    left: 0;
    width: 6px;
    height: 4px;
    border-radius: 2px;
    cursor: pointer;
    opacity: 0.85;
  }
  .marker-pip:hover {
    opacity: 1;
    width: 10px;
    left: -4px;
  }

  /* A name somebody gave a pane. Quiet on purpose: it is for telling panes apart, not for
     reading, and one that competed with the output would be worse than none. */
  /* --- the bar on top of a pane ----------------------------------------
     Only in a tab that holds more than one. A single terminal's name is already the tab's, and
     a strip across the top of it would take rows from the terminal to repeat something. */
  .pane-bar {
    display: none;
  }
  .many-panes .pane-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    /* Two rows of text tall at most. It is furniture around a terminal, not a toolbar, and every
       pixel here is a pixel the terminal does not have. */
    height: 22px;
    flex: 0 0 22px;
    padding: 0 4px 0 8px;
    box-sizing: border-box;
    font-size: 11px;
    line-height: 1;
    color: var(--dim);
    /* A wash of the panel color rather than a color of its own, so it reads as the edge of the
       pane rather than as a thing sitting on top of it. */
    background: linear-gradient(var(--panel), color-mix(in srgb, var(--panel) 82%, var(--bg)));
    border-bottom: 1px solid var(--edge);
    user-select: none;
  }
  /* The focused pane's bar is the same color, lit. The border already says which pane has the
     keyboard; this says it again at the top, where the name is, without introducing a new hue. */
  .many-panes .pane.focused .pane-bar {
    background: linear-gradient(
      color-mix(in srgb, var(--accent) 20%, var(--panel)),
      color-mix(in srgb, var(--accent) 9%, var(--panel))
    );
    color: var(--text);
    border-bottom-color: color-mix(in srgb, var(--accent) 40%, var(--edge));
  }
  .pane-bar-name {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
  }
  .pane-bar-button {
    flex: 0 0 auto;
    background: none;
    border: 0;
    color: inherit;
    opacity: 0.75;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 2px 5px;
    border-radius: 4px;
  }
  .pane-bar-button:hover {
    opacity: 1;
    background: var(--hover);
  }
  .pane-bar-button.is-close:hover {
    background: var(--danger);
    color: var(--panel);
  }
  /* The pane becomes a column, so the bar takes its height off the top and the terminal gets
     the rest. Without this the terminal is still the full height and the bar covers its first
     row, which is where a prompt is. */
  .many-panes .pane {
    display: flex;
    flex-direction: column;
  }
  .many-panes .pane > .pane-terminal {
    /* Out of the absolute fill it uses on its own, so the bar and the terminal share the pane
       as two rows instead of the terminal covering the bar. */
    position: relative;
    inset: auto;
    flex: 1 1 auto;
    min-height: 0;
  }

  .pane-label {
    position: absolute;
    /* Top right, clear of the command button in the same corner. The form that types it moved
       to the bottom instead, which is what stops the two overlapping. */
    top: 40px;
    right: 14px;
    z-index: 4;
    /* Big enough to read at a glance and faint enough to read through, which is the whole point:
       it says which session this is without competing with what the session is saying. Sized
       against the pane, so it stays legible in a narrow one and never grows past it. */
    font-size: clamp(32px, 17cqw, 85px);
    line-height: 1.05;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text);
    opacity: 0.16;
    pointer-events: none;
    user-select: none;
    max-width: 72%;
    text-align: right;
    /* `pre-wrap`, not `normal`. HTML collapses a run of spaces into one, so a name typed with
       five spaces in it was drawn with one and did not match what was in the box. It still
       wraps, so a name is still a name in a small pane. */
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .pane-label-form {
    position: absolute;
    /* Bottom right, so it never covers the name it is naming, nor the command button. A
       terminal fills from the top, so this is the emptier corner while one is being used. */
    bottom: 12px;
    right: 8px;
    z-index: 61;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--edge);
    background: var(--panel);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  .pane-label-input {
    width: 190px;
    padding: 5px 7px;
    border-radius: 6px;
    border: 1px solid #39405a;
    background: #12141a;
    color: var(--text);
    font: inherit;
    font-size: 12px;
  }
  .pane-label-input:focus {
    outline: none;
    border-color: #4d7fd0;
  }
  /* The picker lives here permanently, so this is just where it sits. */
  .pane-label-colors {
    display: flex;
    flex-direction: column;
  }
  .pane-label-actions {
    display: flex;
    justify-content: flex-end;
    gap: 4px;
  }

  /* --- the chooser over an empty pane ----------------------------------- */
  .pane-chooser {
    position: absolute;
    inset: 0;
    z-index: 6;
    display: flex;
    /* At the bottom. A terminal fills from the top, so a panel anchored there would sit over
       the line being typed, which is the one place it must never be. */
    align-items: flex-end;
    justify-content: center;
    padding: 10px;
    pointer-events: none;
  }
  /**
   * Folders as chips that wrap, which is how the start screen lists them.
   *
   * They were a vertical list here and a row of chips there, for the same job. Four folders took
   * four lines of a pane that has very few, and the two screens taught different habits for the
   * same thing.
   */
  .pane-chooser-folders {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-content: flex-start;
    /* Every folder is listed, so this is what keeps a directory of forty from pushing
       `Open here` off the bottom of the pane. */
    overflow-y: auto;
    min-height: 0;
  }
  .pane-chooser-folder {
    flex: none;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid rgba(90, 100, 130, 0.32);
    background: var(--panel);
    color: var(--accent);
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .pane-chooser-folder:hover {
    border-color: var(--accent);
    color: var(--text);
  }

  .pane-chooser-box {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    max-width: 460px;
    /* Bounded well inside the pane it sits in. Without a bound the rows ran past the bottom of
       a short pane and could not be clicked at all. Without the margin at the top, listing every
       folder made the panel taller than the pane and it covered the line being typed on, which
       is the one thing moving it to the bottom was for. The list inside it scrolls instead. */
    max-height: 62%;
    overflow-y: auto;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid rgba(90, 100, 130, 0.26);
    background: var(--panel);
    backdrop-filter: blur(14px);
  }
  .pane-chooser-rows {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 0;
    overflow-y: auto;
  }
  .pane-chooser-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 2px;
  }
  /* The folder chips are styled above, with the wrapping row they sit in. */
  .pane-chooser-browse,
  .pane-chooser-accept,
  .pane-chooser-cancel {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: rgba(255, 255, 255, 0.04);
    color: var(--term-fg);
    font: inherit;
    font-size: 12px;
    text-align: left;
    cursor: pointer;
  }
  .pane-chooser-browse:hover,
  .pane-chooser-accept:hover,
  .pane-chooser-cancel:hover {
    background: rgba(122, 162, 247, 0.16);
    border-color: rgba(122, 162, 247, 0.4);
  }
  .pane-chooser-session.is-confirming {
    border-color: #c9724f;
    background: rgba(201, 114, 79, 0.14);
  }
  .pane-chooser-session-name {
    color: var(--text);
  }
  .pane-chooser-session-cwd,
  .pane-chooser-hint {
    color: var(--dim);
    font-size: 11px;
  }
  .pane-chooser-heading {
    margin-top: 4px;
    color: var(--dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .pane-chooser-badge {
    margin-left: auto;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(122, 162, 247, 0.18);
    color: var(--accent);
    font-size: 10px;
  }
  .pane-chooser-accept {
    background: rgba(122, 162, 247, 0.22);
    border-color: rgba(122, 162, 247, 0.5);
    color: #cfe0ff;
  }
  .pane-chooser-browse {
    justify-content: center;
    color: #cfe0ff;
  }
  .pane-chooser-warn {
    width: 100%;
    color: #f0a98a;
    font-size: 11px;
  }

  .term-menu-rule {
    height: 1px;
    margin: 4px 6px;
    background: #33363f;
  }
  .term-menu-item.is-danger:not(:disabled) {
    color: #ff8a7a;
  }
  .term-menu-item.is-danger:hover:not(:disabled) {
    background: #5c2a26;
  }
  #server-offer {
    position: absolute;
    right: 16px;
    bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border: 1px solid var(--edge);
    border-radius: 8px;
    background: var(--panel);
    font-size: 12px;
    z-index: 35;
  }
  #staged {
    position: absolute;
    inset: 0;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 4px;
    background: var(--panel);
    padding: 32px;
    z-index: 40;
  }
  #staged h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  #staged-source {
    color: var(--dim);
    font-size: 12px;
    margin: 0 0 12px;
    max-width: 70ch;
    overflow-wrap: anywhere;
  }
  #staged-text {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    background: #16181d;
    border: 1px solid var(--edge);
    border-radius: 6px;
    padding: 12px 14px;
    margin: 0;
    max-width: 80ch;
    max-height: 40vh;
    overflow: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .staged-note {
    color: #e8b339;
    font-size: 12px;
    margin: 12px 0 0;
  }
  #staged-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .staged-button {
    padding: 7px 16px;
    border-radius: 6px;
    border: 1px solid var(--edge);
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  .staged-button.primary {
    background: var(--hover);
    border-color: var(--accent);
  }
  #recovery {
    position: absolute;
    inset: 0;
    z-index: 10;
    background: #12131a;
    display: grid;
    place-content: center;
    gap: 14px;
    font:
      14px/1.6 -apple-system,
      BlinkMacSystemFont,
      sans-serif;
    color: var(--term-fg);
    text-align: center;
    padding: 40px;
  }
  #recovery h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
  }
  #recovery-detail {
    display: grid;
    gap: 4px;
    margin: 4px 0 6px;
    font:
      12px/1.6 ui-monospace,
      SFMono-Regular,
      Menlo,
      monospace;
  }
  .recovery-row {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  .recovery-key {
    color: var(--dim);
    min-width: 110px;
    text-align: right;
  }
  .recovery-value {
    color: var(--term-fg);
    text-align: left;
  }
  #recovery-actions {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  #recovery p {
    margin: 0;
    color: #8b91a6;
  }

  /* --- launcher and palette -------------------------------------------- */
  #overlays {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 8;
  }
  #overlays > * {
    pointer-events: auto;
  }

  /*
   * Part of the page, not a window on top of it.
   *
   * It used to be a centred card with its own background, its own border, and its own
   * scrollbar, which made it look like a dialog you had to deal with before you could reach
   * the terminal. It is not: there is a live shell behind it from the moment the tab opens,
   * and this is only here because there is no output yet.
   *
   * So: no card, no second scrollbar, and anchored to the top so the prompt keeps the bottom of
   * the window, where a terminal's input belongs.
   */
  /* `hidden` must win over the display below, or dismissing the panel does nothing at all.
     The recovery overlay had this exact bug once already. */
  .launcher[hidden] {
    display: none;
  }
  /**
   * Opaque, over a terminal that is running underneath it.
   *
   * It used to be transparent, on the reasoning that the prompt showing through at the bottom
   * ties the start screen to the terminal it will become. That holds only while the prompt is
   * near the bottom. A freshly opened shell has printed one line, so its prompt sits on the
   * **first** row, and after a reload it was drawn straight through the top of the start screen,
   * across the path box, as a second line of text belonging to nothing.
   *
   * The strip below is still transparent, so what shows through shows through down there, which
   * is where a prompt belongs.
   */
  .launcher {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    /**
     * Stops short of the strip, and of its top border.
     *
     * Exactly `4.5rem` put this element's opaque edge on the pane's own one-pixel border, so
     * the box around the input had no visible top. The three pixels are that border and a
     * little air.
     */
    /**
     * Set from the pane's measured top, not from the strip's height.
     *
     * The fallback is only for the moment before the first measurement: the terminal has padding
     * below it, so the strip does not begin exactly its own height from the bottom of the
     * window, and computing it that way put this element's opaque edge over the pane's top
     * border by two pixels.
     */
    bottom: var(--launcher-bottom, calc(var(--strip-height, 4.5rem) + 8px));
    padding: 14px 18px 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--bg);
    border: 0;
    overflow: hidden;
  }
  /**
   * The part that scrolls, and the part that fades.
   *
   * Both used to be on the panel itself, which meant the last thing rendered was always the
   * thing being faded out, and a long list pushed it past the edge entirely.
   */
  .launcher-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding-bottom: 6px;
    scrollbar-width: thin;
    scrollbar-color: var(--dim) transparent;
    /* Not faded at the bottom. A list that dissolves into the page hides the row you are reading
       and says nothing a scrollbar does not already say. */
  }

  .launcher-section {
    margin-bottom: 10px;
  }
  /*
   * The shape of the screen before the daemon has answered.
   *
   * A new tab spent about a third of a second empty and then everything arrived at once. The
   * headings and the boxes are the same every time, so they are drawn immediately and filled in.
   * Quiet on purpose: it is scaffolding, not content, and it must not read as something to use.
   */
  .launcher-section.is-placeholder {
    opacity: 0.55;
  }
  .launcher-skeleton-row {
    height: 30px;
    margin-bottom: 6px;
    border-radius: 6px;
    /* Flat. Scaffolding should read as absence, and a shimmer reads as something happening. */
    background: var(--hover);
  }
  /* Quiet. A heading here is a label, not a banner. */
  .launcher-heading {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--dim);
    margin: 0 0 4px;
    font-weight: 600;
  }
  /**
   * The rows of the start screen, evenly spaced.
   *
   * The folder list is inserted between the box and the buttons rather than being one of these
   * children in the markup, so it collected the form's gap above and below **plus** margins of
   * its own. That read as a band of empty space between the folders and the templates while
   * everything else on the screen sat close together.
   */
  .launcher-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .launcher-form > .launcher-completions {
    margin-top: -2px;
    margin-bottom: -2px;
  }
  /* The row of things to open sits directly under the folders it will open. */
  .launcher-form > .launcher-buttons {
    margin-top: 2px;
  }
  /* A drop that carries a path, and one that does not. */
  .launcher-input.is-drop-target {
    border-color: var(--accent);
    background: rgba(61, 107, 168, 0.12);
  }
  .launcher-input.is-drop-refused {
    border-color: #ff8a7a;
  }
  .launcher-input {
    width: 100%;
    box-sizing: border-box;
    background: var(--term-bg);
    border: 1px solid var(--edge);
    border-radius: 6px;
    color: var(--term-fg);
    padding: 7px 10px;
    font:
      13px/1.4 ui-monospace,
      SFMono-Regular,
      Menlo,
      monospace;
  }
  .launcher-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  /**
   * A line about the folder in the box, which is usually saying nothing.
   *
   * `min-height` held eighteen pixels open for a sentence that is only there while a path is
   * being typed, and the parent's gap sat on both sides of it. That is the band of empty space
   * between the folder list and the row of things to open, reported several times: measured, the
   * folders ended at 141 and the buttons began at 175, of which 26 pixels were this.
   *
   * It takes no room when it has nothing to say. `:empty` is exact here because the element is
   * emptied rather than hidden whenever there is no state to report.
   */
  .launcher-folder-state {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 18px;
    font-size: 11px;
    color: var(--dim);
  }
  .launcher-folder-state:empty {
    display: none;
  }
  .launcher-folder-state.is-good {
    color: #8ae2a0;
  }
  .launcher-folder-state.is-bad {
    color: #e0776b;
  }
  .launcher-folder-state.is-missing {
    color: #e0c879;
  }
  .launcher-create-folder {
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid rgba(224, 200, 121, 0.45);
    background: rgba(224, 200, 121, 0.12);
    color: #e0c879;
    font: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .launcher-create-folder:hover {
    background: rgba(224, 200, 121, 0.22);
  }

  /**
   * One row that grows to the right and scrolls, rather than wrapping onto a second line.
   *
   * Templates live in this row now, so it is as long as somebody's list of them. Wrapping moved
   * everything below it down every time one was added, which is a layout that changes shape as
   * you use it. `position: relative` because the hover card is positioned against this row and
   * has to travel with it when it scrolls.
   */
  .launcher-buttons {
    position: relative;
    display: flex;
    gap: 7px;
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: visible;
    padding-bottom: 2px;
    scrollbar-width: thin;
    scroll-behavior: smooth;
    scrollbar-color: rgba(90, 100, 130, 0.4) transparent;
  }
  .launcher-buttons > * {
    flex: none;
  }
  .launcher-chip {
    padding: 5px 11px;
    border-radius: 7px;
    border: 1px solid var(--edge);
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition:
      border-color 120ms ease,
      color 120ms ease;
  }
  .launcher-chip:hover {
    border-color: var(--accent);
    color: var(--text);
  }
  /**
   * The one Return will run.
   *
   * This blue used to mark "Open agent here", which made the least common action look like the
   * default. It marks the selection now, so what a keystroke will do is always the thing that
   * looks chosen.
   */
  .launcher-chip.is-selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(122, 162, 247, 0.55);
    color: var(--text);
    background: rgba(61, 107, 168, 0.18);
  }
  .launcher-chip:focus-visible {
    outline: none;
    border-color: var(--accent);
  }
  /* The shortcut, on the chip that uses it. */
  .launcher-chip kbd {
    margin-left: 6px;
    padding: 0 4px;
    border-radius: 4px;
    background: rgba(90, 100, 130, 0.24);
    color: var(--dim);
    font: inherit;
    font-size: 10px;
  }
  .launcher-chip.is-selected kbd {
    background: rgba(122, 162, 247, 0.24);
    color: var(--text);
  }

  /* Browsing for a folder, since a native dialog cannot give an extension a path. */
  /* The box takes the width; the button takes what it needs. */
  .launcher-path-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
  }
  .launcher-path-row .launcher-input {
    flex: 1 1 auto;
    min-width: 0;
  }
  .launcher-completion.is-up {
    color: var(--dim);
  }
  .launcher-completion-more {
    padding: 5px 8px;
    color: var(--dim);
    font-size: 11.5px;
  }
  .launcher-browse {
    flex: none;
    padding: 6px 10px;
    border-radius: 7px;
    border: 1px solid rgba(90, 100, 130, 0.38);
    background: var(--panel);
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .launcher-browse:hover {
    border-color: var(--accent);
    color: var(--text);
  }
  .launcher-browser {
    margin-top: 8px;
    padding: 8px;
    border-radius: 9px;
    border: 1px solid rgba(90, 100, 130, 0.32);
    background: var(--panel);
  }
  .launcher-browser-path {
    margin-bottom: 6px;
    color: var(--accent);
    font-size: 11.5px;
    word-break: break-all;
  }
  .launcher-browser-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    max-height: 168px;
    overflow-y: auto;
    margin-bottom: 8px;
  }
  .launcher-browser-item {
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid rgba(90, 100, 130, 0.3);
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
  }
  .launcher-browser-item:hover {
    border-color: var(--accent);
    color: var(--text);
  }
  .launcher-browser-item.is-up {
    color: var(--accent);
  }
  .launcher-browser-empty {
    color: var(--dim);
    font-size: 11.5px;
    font-style: italic;
  }

  .launcher-template-form {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 8px;
    padding: 10px;
    border-radius: 9px;
    border: 1px solid rgba(90, 100, 130, 0.32);
    background: var(--panel);
  }
  .launcher-template-command {
    font-size: 12px;
  }
  .launcher-template {
    border-style: solid;
    border-color: rgba(122, 162, 247, 0.35);
  }
  /**
   * `Open` is outlined because it is not one of the others.
   *
   * Everything else in this row is a template: editable, movable, removable. This one is the
   * plainest thing the screen does and is what Return means, so it says so by looking different
   * rather than by being labelled.
   */
  .launcher-chip.is-open-action {
    border-color: #4d7bc4;
    color: var(--text);
  }
  .launcher-template.is-dragging {
    opacity: 0.4;
  }
  .launcher-template.is-drop-target {
    border-color: var(--accent);
    box-shadow: -2px 0 0 0 var(--accent);
  }
  /* The `i`. A card that only appears on hover is a card nobody knows to look for. */
  .launcher-template-info {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    margin-left: 7px;
    border-radius: 50%;
    border: 1px solid rgba(122, 162, 247, 0.45);
    color: #8fb3f0;
    font-size: 9.5px;
    font-style: italic;
    line-height: 1;
  }
  .launcher-template-info:hover {
    background: rgba(122, 162, 247, 0.22);
    color: var(--text);
  }

  /* What a template is, without having to open anything. */
  .template-card {
    position: fixed;
    z-index: 30;
    width: 260px;
    padding: 11px 12px 12px;
    border-radius: 10px;
    border: 1px solid rgba(90, 100, 130, 0.45);
    background: var(--panel);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: template-card-in 120ms ease-out;
  }
  @keyframes template-card-in {
    from {
      opacity: 0;
      transform: translateY(-4px);
    }
  }
  .template-card-name {
    font-size: 13px;
    color: var(--text);
  }
  .template-card-desc {
    font-size: 11.5px;
    color: var(--dim);
    line-height: 1.45;
  }
  /* The arrangement drawn, which is the one thing a name cannot tell you. */
  .template-card-preview {
    position: relative;
    height: 74px;
    border-radius: 6px;
    background: var(--panel);
    /* One pixel of inset, so the rounded corner does not clip the outermost pane's border.

    padding: 1px;

    overflow: hidden;

    gap: 6px;
  }

  .launcher-add-template {
    padding: 5px 10px;
    color: var(--dim);
    border-style: dashed;
  }

  .launcher-chip:hover {
    background: var(--hover);
    border-color: var(--accent);
  }
  .launcher-chip.agent:hover {
    background: #2d4459;
  }
  .launcher-note {
    color: var(--dim);
    font-size: 11px;
    margin-top: 6px;
  }

  /* A row reads as one row. The name is on the left and its star and cross are at the right
     edge, which on a wide window is a long way apart: a faint rule and a tint on every other
     one keep the eye on the line it started on. */
  .launcher-row-wrap {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 1px 4px;
    border-radius: 6px;
    border-bottom: 1px solid rgba(90, 100, 130, 0.12);

    background: rgba(255, 255, 255, 0.016);
  }
  .launcher-row-wrap:hover {
    background: rgba(255, 255, 255, 0.04);
  }
  .launcher-row-wrap:last-child {
    border-bottom: 0;
  }
  /* --- the template dialog ---------------------------------------------- */
  .template-backdrop {
    position: fixed;
    inset: 0;
    z-index: 70;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.45);
  }
  .template-dialog {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: min(520px, calc(100% - 48px));

    overflow-y: auto;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid var(--edge);
    background: var(--panel);
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
  }
  .template-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .template-where {
    font-size: 11.5px;
    color: var(--dim);
    margin-bottom: 4px;
  }
  .template-help {
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--dim);
  }
  .template-layout {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  /* Drawn from the same fractions the layout is built from, so this is what will happen rather
     than an impression of it. */
  .template-preview {
    position: relative;
    height: 128px;
    border-radius: 8px;
    border: 1px solid var(--edge);
    background: rgba(0, 0, 0, 0.25);
    overflow: hidden;
  }
  .template-preview.is-bad {
    opacity: 0.25;
  }
  .template-pane {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(122, 162, 247, 0.5);
    background: rgba(122, 162, 247, 0.12);
    color: var(--dim);
    font-size: 12px;
    box-sizing: border-box;
  }
  .template-problem:not(:empty) {
    font-size: 11.5px;
    color: #ff8a7a;
  }
  .template-commands {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .template-command {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .template-command-tag {
    flex: none;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    border: 1px solid var(--edge);
    color: var(--dim);
    font-size: 11.5px;
  }
  .template-command .launcher-input {
    flex: 1 1 auto;
  }

  .launcher-agent {
    flex: none;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 999px;
    border: 1px solid rgba(90, 100, 130, 0.34);
    color: var(--dim);
    text-transform: lowercase;
  }
  /* A resume row is mostly its text, so the text takes the room and everything else stays put. */
  .launcher-row.is-resume > .launcher-strong {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .launcher-row-action {
    flex: none;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #5b6070;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  .launcher-row-action:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.06);
  }
  /*
   * The control that opens a conversation, in words rather than as a chevron.
   *
   * It is the thing that makes this list usable when three sessions start the same way, so it
   * says what it does instead of being found by accident.
   */
  .launcher-row-action.is-expand {
    width: auto;
    padding: 0 8px;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--dim);
    border: 1px solid rgba(90, 100, 130, 0.28);
  }
  .launcher-row-action.is-expand:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .launcher-row-action.is-expand[aria-expanded='true'] {
    color: var(--accent);
    border-color: rgba(122, 162, 247, 0.45);
  }
  /**
   * An expanded row and its conversation, which push what is below them down.
   *
   * A panel rather than a window, because deciding between three sessions means reading them in
   * place. Nothing is covered up and the list stays where it was.
   */
  .launcher-row-holder {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .launcher-transcript {
    max-height: 190px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 0 0 2px 8px;
    padding: 8px 10px;
    border-left: 2px solid rgba(90, 100, 130, 0.35);
    border-radius: 0 6px 6px 0;
    background: rgba(255, 255, 255, 0.025);
    font-size: 11.5px;
    line-height: 1.45;
    scrollbar-width: thin;
    scrollbar-color: rgba(90, 100, 130, 0.4) transparent;
  }
  .launcher-transcript.is-waiting {
    color: var(--dim);
    font-style: italic;
  }
  /*
   * One turn: who, then what, with the text able to wrap under itself.
   *
   * The speaker sits in a fixed column so the conversation reads straight down. A turn is capped
   * in height so one enormous message cannot fill the panel and hide the rest of the exchange,
   * which is the thing being read for.
   */
  /*
   * A turn is shown whole and the panel scrolls, rather than each turn being clipped.

   * Clipping every turn and fading its last line was tried first: it made the whole panel look
   * washed out and unreadable, which is worse than a panel somebody scrolls. The reader already
   * shortens anything that is really tool output rather than talk.
   */
  .launcher-turn {
    display: flex;
    gap: 8px;
    align-items: baseline;

  .launcher-turn-who {
    flex: none;
    width: 38px;

    color: #b9becb;

    color: var(--text);
  }

  .launcher-badge {

    background: #23262c;

  .launcher-row-group {

  .launcher-chip.project {

  }
  /* One line, always. A row that wraps turns a list into a paragraph. */
  .launcher-row {
    flex: 1;
    display: flex;
    align-items: baseline;

    background: transparent;
    border: 0;
    border-radius: 5px;
    color: inherit;

    font: inherit;

    white-space: nowrap;
    overflow: hidden;

  .launcher-row > * {
    overflow: hidden;
    text-overflow: ellipsis;

  .launcher-row:hover {
    background: #262a38;
  }
  .launcher-strong {
    font-weight: 600;
    white-space: nowrap;
  }
  .launcher-dim {
    color: var(--dim);
    font-size: 11.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .launcher-icon {
    background: transparent;
    border: 0;
    color: #5f6579;
    cursor: pointer;
    font-size: 13px;
    padding: 4px 6px;
    border-radius: 4px;
  }
  .launcher-icon:hover {
    color: var(--term-fg);
    background: #262a38;

  .launcher-icon.on {
    color: #e8c26a;
  }
  /* Shown only when Tab could not decide, so it is never permanent furniture. */
  /* Under the box, wrapping, and bounded: a home directory can hold hundreds and this is a
     means of getting somewhere rather than a view of the filesystem. */
  /**
   * As tall as the folders need, up to three rows, and no taller.
   *
   * It had a fixed 132px with a scrollbar, so a home directory with a handful of folders left a
   * band of empty space between the list and the buttons under it, and one with many hid the
   * rest behind a scrollbar nobody looks for. Three rows is enough to recognise where you are;
   * past that the box says so and typing is the faster way there anyway.
   */
  .launcher-completions {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    overflow: hidden;
    align-content: flex-start;
  }
  .launcher-completion.is-more {
    border-style: dashed;

    cursor: default;
  }
  .launcher-completion {
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid var(--edge);
    background: var(--panel);
    /* A folder name is a name. The accent is for the one that is about to be used, not for
       twenty of them at once, which reads as a wall of links. */
    color: var(--text);
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
  }
  .launcher-completion:hover {
    border-color: var(--accent);

  /* Outside the scrolling area, so it is never the thing that gets cut off. */
  /* The fade stops short of the bottom, so it never lies on the terminal's top border.
     Padding alone did not do it: the gradient paints to the element's own edge, so the edge had
     to move up rather than the text. `background-size` keeps the text where it was and shortens
     only what is painted behind it. */
  .launcher-hint {
    flex: none;
    color: var(--dim);
    font-size: 11.5px;
    border-top: 1px solid var(--edge);
    padding: 8px 0 16px;

  .palette {
    position: absolute;
    left: 50%;
    top: 60px;
    transform: translateX(-50%);
    width: min(700px, calc(100% - 48px));
    background: #1a1c26;
    border: 1px solid #2f3346;
    border-radius: 10px;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.6);
    overflow: hidden;
    font:
      13px/1.5 -apple-system,
      BlinkMacSystemFont,
      sans-serif;

    width: 100%;
    box-sizing: border-box;
    background: #12131a;
    border: 0;
    border-bottom: 1px solid #2f3346;
    color: var(--term-fg);
    padding: 11px 14px;
    font:
      13px/1.4 -apple-system,
      BlinkMacSystemFont,
      sans-serif;
  }
  .palette-input:focus {
    outline: none;
  }
  .palette-list {
    max-height: 320px;
    overflow-y: auto;
  }
  .palette-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 7px 14px;
    cursor: pointer;
  }
  /*
   * Selection is now a step of its own, so it has to be unmistakable: an accent bar as well as
   * a background, because a background alone is easy to lose against a long list.
   */
  .palette-row.selected {
    background: var(--selected);
    box-shadow: inset 3px 0 0 var(--selected-edge);
  }
  /* Hover is deliberately weaker than selection. They mean different things now. */
  .palette-row:hover:not(.selected) {
    background: #23262c;
  }
  .palette-row:hover {
    background: #262a38;
  }
  .palette-command {
    flex: 1;
    font:
      12.5px/1.4 ui-monospace,
      SFMono-Regular,
      Menlo,
      monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .palette-row.failed .palette-command {
    color: #e0776b;
  }
  .palette-row.is-merge .palette-command {
    color: #8ab4f8;
  }
  .palette-row.is-saved .palette-command {
    color: #8ae2a0;
  }
  /**
   * A row that goes somewhere, rather than one that does something here.
   *
   * `Change keyboard shortcuts` opens a Chrome page. Sitting among the actions in the same
   * weight it read as one more thing this tab would do.
   */
  /**
   * The cards inside a pane chooser, which are the start screen's own.
   *
   * Narrower and capped at one row: a pane is a small place to read a list, and the point here
   * is recognising one session rather than surveying all of them.
   */
  .pane-chooser-grid {
    --card-height: 132px;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    max-height: calc(var(--card-height) + 6px);
    margin-top: 4px;
  }
  .pane-chooser-grid .session-screen {
    height: 84px;
  }
  .pane-chooser-grid .session-card.is-confirming {
    border-color: #e8c26a;
  }
  .pane-chooser-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 8px;
  }
  .pane-chooser-dismiss {
    padding: 3px 10px;
    border-radius: 6px;
    border: 1px solid rgba(90, 100, 130, 0.38);
    background: transparent;
    color: var(--dim);

    font-size: 11.5px;
    cursor: pointer;
  }
  .pane-chooser-dismiss:hover {
    color: var(--text);
    border-color: var(--accent);
  }

  /**
   * The controls on an action somebody made, shown only under the pointer.

   * A pencil beside every row would turn a list of things to do into a table of things to

   */
  .palette-action-edit,
  .palette-action-remove {
    flex: none;
    margin-left: 6px;
    padding: 0 5px;

    opacity: 0;

  .palette-row:hover .palette-action-edit,
  .palette-row:hover .palette-action-remove,
  .palette-row.selected .palette-action-edit,
  .palette-row.selected .palette-action-remove {

  .palette-action-edit:hover {

  }
  .palette-action-remove:hover {

  /* A label above a group, which is not a row and does not behave like one. */
  .palette-heading {

  .palette-delete {

  .palette-delete:hover {

  .palette-empty {

<body>
  <div id="status" hidden></div>
  <div id="terminal"></div>
  <div id="overlays"></div>
  <div id="recovery" hidden>
    <h1 id="recovery-reason">This terminal session expired.</h1>
    <p>Nothing was run automatically.</p>
    <div id="recovery-detail"></div>
    <div id="recovery-actions"></div>
  </div>
  <button id="cmd-button" title="Commands (Command+K)">⌘</button>
  <button id="clear-undo" hidden title="Bring back what was just cleared">Undo clear</button>
  <!--
    A way back from closing a pane or moving one to its own tab. Under the menu button, in the
    same place and the same shape as the undo for a clear, because it is the same promise.
    The cross dismisses the button without giving up the way back: Command+Z still works for
    the rest of the five minutes, which is what was asked for and is also right, since hiding a
    reminder is not the same as saying no.
  -->
  <div id="undo-offer" hidden>
    <button id="undo-offer-do" type="button"></button>
    <button id="undo-offer-hide" type="button" title="Hide this. Command+Z still works.">×</button>
  </div>

  <div id="server-offer" hidden>
    <span id="server-text"></span>
    <button id="server-open" class="staged-button primary"></button>
    <button id="server-dismiss" class="staged-button">Dismiss</button>
  </div>
  <div id="staged" hidden>
    <h1>Send this to the terminal?</h1>
    <p id="staged-source"></p>
    <pre id="staged-text"></pre>
    <p class="staged-note">
      It will be placed at the prompt, not run. Press Enter yourself once you have read it.
    </p>
    <div id="staged-actions">
      <button id="staged-accept" class="staged-button primary">Place at the prompt</button>
      <button id="staged-cancel" class="staged-button">Discard</button>
    </div>
  </div>
  <script type="module" src="terminal.js"></script>
</body>
