name: Extension checks and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tabterm/release-tag"
          test "$(git cat-file -t refs/tabterm/release-tag)" = tag
          test "$(git rev-parse 'refs/tabterm/release-tag^{commit}')" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if(process.env.RELEASE_TAG !== `v${p.version}`) throw Error("Tag/version mismatch");'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify
      - run: npm run package:extension
      - run: node scripts/package-companion.mjs
      - name: Verify archive
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/check-extension-release.mjs "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-${{ github.sha }}
          path: |
            dist/tabterm-extension-*.zip
            dist/tabterm-companion-*.tar.gz
            dist/companion-release.json
          if-no-files-found: error

  submit:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: chrome-web-store
    concurrency:
      group: chrome-web-store-submission
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extension-${{ github.sha }}
          path: dist
      - name: Check publishing configuration
        env:
          PUBLISHER: ${{ vars.CWS_PUBLISHER_ID }}
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "$PUBLISHER"
          test -n "$PROVIDER"
          test -n "$ACCOUNT"
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload and submit for review
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/publish-extension.mjs

  companion:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extension-${{ github.sha }}
          path: dist
      - name: Publish companion release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_COMMIT" --title "TabTerm $RELEASE_TAG" --generate-notes dist/companion-release.json dist/tabterm-companion-*.tar.gz dist/tabterm-extension-*.zip
