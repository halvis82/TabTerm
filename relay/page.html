/**
 *  Default styles for xterm.js
 */

.xterm {
    cursor: text;
    position: relative;
    user-select: none;
    -ms-user-select: none;
    -webkit-user-select: none;
}

.xterm.focus,
.xterm:focus {
    outline: none;
}

.xterm .xterm-helpers {
    position: absolute;
    top: 0;
    /**
     * The z-index of the helpers must be higher than the canvases in order for
     * IMEs to appear on top.
     */
    z-index: 5;
}

.xterm .xterm-helper-textarea {
    padding: 0;
    border: 0;
    margin: 0;
    /* Move textarea out of the screen to the far left, so that the cursor is not visible */
    position: absolute;
    opacity: 0;
    left: -9999em;
    top: 0;
    width: 0;
    height: 0;
    z-index: -5;
    /** Prevent wrapping so the IME appears against the textarea at the correct position */
    white-space: nowrap;
    overflow: hidden;
    resize: none;
}

.xterm .composition-view {
    /* TODO: Composition position got messed up somewhere */
    background: #000;
    color: #FFF;
    display: none;
    position: absolute;
    white-space: nowrap;
    z-index: 1;
}

.xterm .composition-view.active {
    display: block;
}

.xterm .xterm-viewport {
    /* On OS X this is required in order for the scroll bar to appear fully opaque */
    background-color: #000;
    overflow-y: scroll;
    cursor: default;
    position: absolute;
    right: 0;
    left: 0;
    top: 0;
    bottom: 0;
}

.xterm .xterm-screen {
    position: relative;
}

.xterm .xterm-screen canvas {
    position: absolute;
    left: 0;
    top: 0;
}

.xterm-char-measure-element {
    display: inline-block;
    visibility: hidden;
    position: absolute;
    top: 0;
    left: -9999em;
    line-height: normal;
}

.xterm.enable-mouse-events {
    /* When mouse events are enabled (eg. tmux), revert to the standard pointer cursor */
    cursor: default;
}

.xterm.xterm-cursor-pointer,
.xterm .xterm-cursor-pointer {
    cursor: pointer;
}

.xterm.column-select.focus {
    /* Column selection mode */
    cursor: crosshair;
}

.xterm .xterm-accessibility:not(.debug),
.xterm .xterm-message {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    right: 0;
    z-index: 10;
    color: transparent;
    pointer-events: none;
}

.xterm .xterm-accessibility-tree:not(.debug) *::selection {
  color: transparent;
}

.xterm .xterm-accessibility-tree {
  font-family: monospace;
  user-select: text;
  white-space: pre;
}

.xterm .xterm-accessibility-tree > div {
  transform-origin: left;
  width: fit-content;
}

.xterm .live-region {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
}

.xterm-dim {
    /* Dim should not apply to background, so the opacity of the foreground color is applied
     * explicitly in the generated class and reset to 1 here */
    opacity: 1 !important;
}

.xterm-underline-1 { text-decoration: underline; }
.xterm-underline-2 { text-decoration: double underline; }
.xterm-underline-3 { text-decoration: wavy underline; }
.xterm-underline-4 { text-decoration: dotted underline; }
.xterm-underline-5 { text-decoration: dashed underline; }

.xterm-overline {
    text-decoration: overline;
}

.xterm-overline.xterm-underline-1 { text-decoration: overline underline; }
.xterm-overline.xterm-underline-2 { text-decoration: overline double underline; }
.xterm-overline.xterm-underline-3 { text-decoration: overline wavy underline; }
.xterm-overline.xterm-underline-4 { text-decoration: overline dotted underline; }
.xterm-overline.xterm-underline-5 { text-decoration: overline dashed underline; }

.xterm-strikethrough {
    text-decoration: line-through;
}

.xterm-screen .xterm-decoration-container .xterm-decoration {
	z-index: 6;
	position: absolute;
}

.xterm-screen .xterm-decoration-container .xterm-decoration.xterm-decoration-top-layer {
	z-index: 7;
}

.xterm-decoration-overview-ruler {
    z-index: 8;
    position: absolute;
    top: 0;
    right: 0;
    pointer-events: none;
}

.xterm-decoration-top {
    z-index: 2;
    position: relative;
}



/* Derived from vs/base/browser/ui/scrollbar/media/scrollbar.css */

/* xterm.js customization: Override xterm's cursor style */
.xterm .xterm-scrollable-element > .scrollbar {
    cursor: default;
}

/* Arrows */
.xterm .xterm-scrollable-element > .scrollbar > .scra {
	cursor: pointer;
	font-size: 11px !important;
}

.xterm .xterm-scrollable-element > .visible {
	opacity: 1;

	/* Background rule added for IE9 - to allow clicks on dom node */
	background:rgba(0,0,0,0);

	transition: opacity 100ms linear;
	/* In front of peek view */
	z-index: 11;
}
.xterm .xterm-scrollable-element > .invisible {
	opacity: 0;
	pointer-events: none;
}
.xterm .xterm-scrollable-element > .invisible.fade {
	transition: opacity 800ms linear;
}

/* Scrollable Content Inset Shadow */
.xterm .xterm-scrollable-element > .shadow {
	position: absolute;
	display: none;
}
.xterm .xterm-scrollable-element > .shadow.top {
	display: block;
	top: 0;
	left: 3px;
	height: 3px;
	width: 100%;
	box-shadow: var(--vscode-scrollbar-shadow, #000) 0 6px 6px -6px inset;
}
.xterm .xterm-scrollable-element > .shadow.left {
	display: block;
	top: 3px;
	left: 0;
	height: 100%;
	width: 3px;
	box-shadow: var(--vscode-scrollbar-shadow, #000) 6px 0 6px -6px inset;
}
.xterm .xterm-scrollable-element > .shadow.top-left-corner {
	display: block;
	top: 0;
	left: 0;
	height: 3px;
	width: 3px;
}
.xterm .xterm-scrollable-element > .shadow.top.left {
	box-shadow: var(--vscode-scrollbar-shadow, #000) 6px 0 6px -6px inset;
}

    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #161b22;
        --raised: #1c2128;
        --line: #30363d;
        --fg: #e6edf3;
        --dim: #8b949e;
        --accent: #58a6ff;
        --warn: #f0b72f;
        --ok: #3fb950;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.4 -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        -webkit-text-size-adjust: 100%;
        /* Taps are taps: pressing A+ twice quickly must not zoom the page. Pinching still does. */
        touch-action: manipulation;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
      }
      [hidden] {
        display: none !important;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }

      /* Locked */
      #screen-lock {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 32px 24px;
        padding-top: max(32px, env(safe-area-inset-top));
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: var(--raised);
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        font:
          600 22px ui-monospace,
          Menlo,
          monospace;
        color: var(--accent);
      }
      #lock-status {
        color: var(--dim);
        max-width: 32ch;
        margin: 0;
      }
      #lock-status[data-tone='warn'] {
        color: var(--warn);
      }
      #pair-form {
        display: flex;
        gap: 8px;
        width: min(100%, 420px);
      }
      #pair-input {
        flex: 1;
        min-width: 0;
        height: 46px;
        padding: 0 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--raised);
        color: var(--fg);
        font:
          15px ui-monospace,
          Menlo,
          monospace;
      }
      #pair-form button {
        height: 46px;
        padding: 0 18px;
        border-radius: 10px;
        border: 0;
        background: var(--accent);
        color: #0d1117;
        font-weight: 600;
      }
      #scan {
        width: min(100%, 420px);
        height: 46px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--raised);
        color: var(--fg);
        font-weight: 600;
      }
      #repair {
        border: 0;
        background: none;
        color: var(--accent);
        padding: 8px;
      }
      #scanner {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 16px;
        background: var(--bg);
        text-align: center;
      }
      #scan-video {
        width: min(100%, 420px);
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 12px;
        background: #000;
      }
      #scanner p {
        color: var(--dim);
        margin: 0;
        max-width: 32ch;
      }
      #scan-cancel {
        min-width: 160px;
        height: 46px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--raised);
        color: var(--fg);
      }
      #unlock {
        min-width: 220px;
        height: 50px;
        border-radius: 12px;
        border: 0;
        background: var(--accent);
        color: #0d1117;
        font-weight: 600;
      }

      /* The list */
      #screen-list {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        padding-top: max(10px, env(safe-area-inset-top));
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      header h1 {
        font-size: 17px;
        margin: 0;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #device-name {
        color: var(--dim);
        font-size: 13px;
      }
      #tabs {
        padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .tab-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--dim);
        text-transform: none;
        margin: 0 0 8px 2px;
      }
      .pane {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 100%;
        text-align: left;
        padding: 12px 14px;
        margin-bottom: 8px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--raised);
      }
      .pane:active {
        background: var(--line);
      }
      .pane-top {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pane-title {
        font-weight: 600;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pane-cwd {
        color: var(--dim);
        font-size: 13px;
        font-family: ui-monospace, Menlo, monospace;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .badge {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid currentColor;
      }
      .badge.needs {
        color: var(--warn);
      }
      .badge.busy {
        color: var(--ok);
      }
      .empty {
        color: var(--dim);
        text-align: center;
        margin-top: 40px;
      }

      /* A terminal */
      #screen-terminal {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        height: 100dvh;
      }
      .icon-button {
        min-width: 40px;
        height: 36px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--raised);
        padding: 0 10px;
      }
      .icon-button[aria-pressed='true'] {
        border-color: var(--accent);
        color: var(--accent);
      }
      .icon-button:disabled {
        opacity: 0.4;
      }
      #ended-note {
        margin: 12px 16px 0;
        color: var(--warn);
        font-size: 14px;
      }
      #notify-hint {
        margin: 12px 16px 0;
        color: var(--dim);
        font-size: 13px;
      }
      #term-wrap {
        flex: 1;
        min-height: 0;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        padding: 4px;
      }
      #term {
        display: inline-block;
      }
      #keys,
      #watch-only {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 8px 10px;
        padding-bottom: max(8px, env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        background: var(--panel);
      }
      #keys button {
        flex: none;
        min-width: 46px;
        height: 38px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--raised);
        font-size: 14px;
      }
      #watch-only {
        color: var(--dim);
        font-size: 13px;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <main id="screen-lock">
      <div class="mark">&gt;_</div>
      <p id="lock-status">Starting</p>
      <button id="unlock" type="button" hidden>Unlock</button>
      <form id="pair-form" hidden>
        <input
          id="pair-input"
          type="text"
          inputmode="url"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Paste a pairing link"
          aria-label="Pairing link"
        />
        <button type="submit">Pair</button>
      </form>
      <button id="scan" type="button" hidden>Scan code</button>
      <button id="repair" type="button" hidden>Pair this device again</button>
    </main>

    <main id="scanner" hidden>
      <video id="scan-video" playsinline muted></video>
      <p>Point the camera at the code in TabTerm Settings on your Mac.</p>
      <button id="scan-cancel" type="button">Cancel</button>
    </main>

    <main id="screen-list" hidden>
      <header>
        <h1>TabTerm</h1>
        <span id="device-name"></span>
        <button id="notify" class="icon-button" type="button" aria-pressed="false" hidden>
          Notify me
        </button>
      </header>
      <p id="ended-note" role="status" hidden></p>
      <p id="notify-hint" hidden></p>
      <div id="tabs"></div>
    </main>

    <main id="screen-terminal" hidden>
      <header>
        <button id="back" class="icon-button" type="button" aria-label="Back to the list">
          Back
        </button>
        <h1 id="term-title"></h1>
        <button
          id="fit"
          class="icon-button"
          type="button"
          aria-pressed="false"
          aria-label="Fit the whole terminal on the screen"
        >
          Fit
        </button>
        <button id="zoom-out" class="icon-button" type="button" aria-label="Smaller text">
          A-
        </button>
        <button id="zoom-in" class="icon-button" type="button" aria-label="Larger text">A+</button>
      </header>
      <div id="term-wrap"><div id="term"></div></div>
      <div id="keys">
        <button type="button" id="type">Keyboard</button>
        <button type="button" data-key="esc">Esc</button>
        <button type="button" data-key="tab">Tab</button>
        <button type="button" data-key="ctrlc">Ctrl C</button>
        <button type="button" data-key="up" aria-label="Up">&#8593;</button>
        <button type="button" data-key="down" aria-label="Down">&#8595;</button>
        <button type="button" data-key="left" aria-label="Left">&#8592;</button>
        <button type="button" data-key="right" aria-label="Right">&#8594;</button>
        <button type="button" data-key="enter">Return</button>
      </div>
      <div id="watch-only" hidden>
        This device can watch, and typing is turned off for it on your Mac.
      </div>
    </main>
