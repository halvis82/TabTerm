# The TabTerm relay. Deployed to your own Cloudflare account, free plan.
# See docs/17-remote-access.md for the setup, and for what this can and cannot see.
name = "tabterm-relay"
main = "worker.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# A room in use the whole time kept running old code through deploys: it never went idle, so it
# was never started again. Renaming the class makes Cloudflare replace every running room. A room
# keeps nothing that matters, only a counter for naming connections.
[[migrations]]
tag = "v2"
renamed_classes = [{ from = "Room", to = "RelayRoom" }]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true
